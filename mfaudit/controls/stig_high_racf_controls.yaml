- control_id: STIG-V-223788
  title: The IBM z/OS systems requiring data-at-rest protection must properly employ IBM DS8880 or equivalent
    hardware solutions for full disk encryption.
  severity: high
  requirement: |-
    Discussion:
    This control addresses the confidentiality and integrity of information at rest and covers user information and system information. Information at rest refers to the state of information when it is located on storage devices as specific components of information systems. Operating systems handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

    Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records, or fields).

    Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.

    Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000405-GPOS-00184, SRG-OS-000404-GPOS-00183, SRG-OS-000396-GPOS-00176

    Check procedure:
    Determine if IBM's DS8880 Disks or equivalent hardware solutions are in use.

    If they are not in use for systems that require data at rest, this is a finding.
  stig:
    rule_id: SV-223788r1028297_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-OS-000320
    reference: V-223788 | SV-223788r1028297_rule | CCI-001199
  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = 'Additional evidence required for V-223788: Obtain storage-controller encryption configuration and key-management evidence from the storage team; RACF data does not describe disk encryption.'
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: Employ IBM's DS8880 hardware or equivalent hardware solutions to ensure full disk encryption.
  source_metadata:
    vulnerability_id: V-223788
    rule_id: SV-223788r1028297_rule
    rule_version: RACF-OS-000320
    check_id: C-25461r803636_chk
    fix_id: F-25449r803664_fix
    cci: CCI-001199
    documentable: 'false'
    coverage: MANUAL
    evidence_note: Obtain storage-controller encryption configuration and key-management evidence from
      the storage team; RACF data does not describe disk encryption.
- control_id: STIG-V-223807
  title: The IBM RACF SSH daemon must be configured to use a FIPS 140-2 compliant cryptographic algorithm
    to protect confidential information and remote access sessions.
  severity: high
  requirement: |-
    Discussion:
    Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. Cryptographic modules must adhere to the higher standards approved by the federal government since this provides assurance they have been tested and validated.

    Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.

    Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.

    Check procedure:
    Locate the SSH daemon configuration file, which may be found in /etc/ssh/ directory.

    Alternately:
    From the Unix System Services ISPF Shell, navigate to ribbon select tools.
    Select option 1 - Work with Processes.

    If SSH Daemon is not active, this is not a finding.

    Examine SSH daemon configuration file.
    sshd_config

    If there are no "Ciphers" lines, or the ciphers list contains any cipher not starting with "aes", this is a finding.

    If the MACs line is not configured to "hmac-sha1" or greater this is a finding.

    Examine the z/OS-specific sshd server systemwide configuration:
    zos_sshd_config

    If any of the following is untrue, this is a finding.

    FIPSMODE=YES
    CiphersSource=ICSF
    MACsSource=ICSF
  stig:
    rule_id: SV-223807r1083014_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-SH-000020
    reference: V-223807 | SV-223807r1083014_rule | CCI-000068
  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = 'Additional evidence required for V-223807: Collect the active sshd_config and zos_sshd_config files plus evidence of whether the SSH daemon is running.'
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Edit the SSH daemon configuration and remove any ciphers not starting with  "aes". If necessary, add a "Ciphers" line using FIPS 140-2 compliant algorithms.

    Configure for message authentication to MACs "hmac-sha1" or greater.

    Edit the z/OS-specific sshd server systemwide configuration file configuration as follows:
    FIPSMODE=YES
    CiphersSource=ICSF
    MACsSource=ICSF
  source_metadata:
    vulnerability_id: V-223807
    rule_id: SV-223807r1083014_rule
    rule_version: RACF-SH-000020
    check_id: C-25480r1083013_chk
    fix_id: F-25468r1082847_fix
    cci: CCI-000068
    documentable: 'false'
    coverage: MANUAL
    evidence_note: Collect the active sshd_config and zos_sshd_config files plus evidence of whether the
      SSH daemon is running.
- control_id: STIG-V-223810
  title: IBM z/OS SSH daemon must be configured to only use the SSHv2 protocol.
  severity: high
  requirement: |-
    Discussion:
    In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical and logical ports/protocols on information systems.

    Operating systems are capable of providing a wide variety of functions and services. Some of the functions and services provided by default may not be necessary to support essential organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component.

    To support the requirements and principles of least functionality, the operating system must support the organizational requirements, providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved to conduct official business or to address authorized quality of life issues.

    Check procedure:
    Locate the SSH daemon configuration file, which may be found in /etc/ssh/ directory.

    Alternately:
    From UNIX System Services ISPF Shell navigate to ribbon select tools.
    Select option 1 - Work with Processes.

    If SSH Daemon is not active, this is not a finding.

    Examine SSH daemon configuration file. If the variables "Protocol 2,1" or "Protocol 1" are defined on a line without a leading comment, this is a finding.
  stig:
    rule_id: SV-223810r958480_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-SH-000050
    reference: V-223810 | SV-223810r958480_rule | CCI-000382
  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = 'Additional evidence required for V-223810: Collect the active sshd_config file plus evidence of whether the SSH daemon is running.'
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: Edit the sshd_config file and set the "Protocol" setting to "2".
  source_metadata:
    vulnerability_id: V-223810
    rule_id: SV-223810r958480_rule
    rule_version: RACF-SH-000050
    check_id: C-25483r515118_chk
    fix_id: F-25471r515119_fix
    cci: CCI-000382
    documentable: 'false'
    coverage: MANUAL
    evidence_note: Collect the active sshd_config file plus evidence of whether the SSH daemon is running.
- control_id: STIG-V-223838
  title: The IBM z/OS UNIX SUPERUSER resources must be protected in accordance with guidelines.
  severity: high
  requirement: |-
    Discussion:
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

    Access control policies include: identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include: access control lists, access control matrices, and cryptography. These policies and mechanisms must be employed by the application to control access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs, and domains) in the information system.

    Check procedure:
    From the ISPF Command Shell enter:
    RL UNIXPRIV * AUTHUSER

    If the RACF rules for the SUPERUSER resource specify a default access of NONE, this is not a finding.

    If there are no RACF rules that allow access to the SUPERUSER resource, this is not a finding.

    If there is no RACF rule for CHOWN.UNRESTRICTED defined, this is not a finding.

    If the RACF rules for each of the SUPERUSER resources listed in the z/OS UNIX System Services Planning, Establishing UNIX security, specify a default access of NONE, this is not a finding.

    If the RACF rules for each of the SUPERUSER resources listed in the z/OS UNIX System Services Planning, Establishing UNIX security, restrict access to appropriate system tasks or systems programming personnel, this is not a finding.
  stig:
    rule_id: SV-223838r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-US-000010
    reference: V-223838 | SV-223838r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.generals
    logic: |
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      profiles = irrdbu00.generals[
          (irrdbu00.generals['GRBD_CLASS_NAME'] == 'UNIXPRIV') &
          (
              irrdbu00.generals['GRBD_NAME'].str.startswith('SUPERUSER', na=False) |
              (irrdbu00.generals['GRBD_NAME'] == 'CHOWN.UNRESTRICTED')
          )
      ].copy()
      access = irrdbu00.generalAccess[
          (irrdbu00.generalAccess['GRACC_CLASS_NAME'] == 'UNIXPRIV') &
          (
              irrdbu00.generalAccess['GRACC_NAME'].str.startswith('SUPERUSER', na=False) |
              (irrdbu00.generalAccess['GRACC_NAME'] == 'CHOWN.UNRESTRICTED')
          )
      ].copy()
      bad_uacc = profiles[profiles['GRBD_UACC'] != 'NONE']
      findings = [
          {
              'GRBD_NAME': row['GRBD_NAME'], 'GRBD_UACC': row['GRBD_UACC'],
              'GRACC_AUTH_ID': '', 'AUTH_TYPE': '', 'GRACC_ACCESS': ''
          }
          for _, row in bad_uacc.iterrows()
      ]
      findings.extend([
          {
              'GRBD_NAME': row['GRACC_NAME'], 'GRBD_UACC': 'NONE',
              'GRACC_AUTH_ID': row['GRACC_AUTH_ID'],
              'AUTH_TYPE': auth_type(row['GRACC_AUTH_ID']),
              'GRACC_ACCESS': row['GRACC_ACCESS']
          }
          for _, row in access.iterrows()
      ])
      if len(bad_uacc):
          status = 'FAIL'
          detail = f'{len(bad_uacc)} SUPERUSER/CHOWN profile(s) have UACC other than NONE'
      elif len(access):
          status = 'REVIEW'
          detail = (
              f'All relevant UNIXPRIV profiles have UACC NONE; validate '
              f'{len(access)} explicit permit(s) as authorized system tasks or users'
          )
      else:
          status = 'PASS'
          detail = 'No unrestricted SUPERUSER/CHOWN access was found'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Configure all SUPERUSER resources for the UNIXPRIV resource class to be restricted to appropriate system tasks and/or system programming personnel.

    -The RACF rules for the SUPERUSER resource specify a default access of NONE.
    -There are no RACF rules that allow access to the SUPERUSER resource.
    -There is no RACF rule for CHOWN.UNRESTRICTED defined.
    -The RACF rules for each of the SUPERUSER resources listed in the z/OS UNIX System Services Planning, Establishing UNIX security, specify a default access of NONE.
    -The RACF rules for each of the SUPERUSER resources listed in the z/OS UNIX System Services Planning, Establishing UNIX security, restrict access to appropriate system tasks or systems programming personnel.

    Sample Commands:
    RDEF UNIXPRIV SUPERUSER.** UACC(NONE) OWNER(ADMIN) DATA('REFERENCE ZUSS0023') AUDIT(ALL(READ))
    /* do not permit any users/groups to this resource */

    SR CLASS(UNIXPRIV) MASK(CHOWN.UNRESTRICTED)
    /* delete if found */

    PE SUPERUSER.FILESYS.** CL(UNIXPRIV) ID(<SYSPsmpl>)
  source_metadata:
    vulnerability_id: V-223838
    rule_id: SV-223838r1137691_rule
    rule_version: RACF-US-000010
    check_id: C-25511r515202_chk
    fix_id: F-25499r515203_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: UNIXPRIV UACC is automated; explicit permit holders require validation as appropriate
      system tasks or users.
- control_id: STIG-V-223837
  title: IBM RACF LOGONIDs must not be defined to SYS1.UADS for non-emergency use.
  severity: high
  requirement: |-
    Discussion:
    Privileged functions include, for example, establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Non-privileged users are individuals that do not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from non-privileged users.

    Check procedure:
    Ask the system administrator to provide a list of all emergency userids available to the site along with the associated function of each.

     If SYS1.UADS userids are limited and reserved for emergency purposes only, this is not a finding.
  stig:
    rule_id: SV-223837r958726_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-TS-000020
    reference: V-223837 | SV-223837r958726_rule | CCI-002235
  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = 'Additional evidence required for V-223837: Collect the SYS1.UADS user-ID inventory and the approved emergency-ID register. IRRDBU00 contains RACF users, not UADS accounts.'
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: Configure the SYS1.UADS entries to ensure LOGONIDs defined include only those users required
    to support specific functions related to system recovery. Evaluate the impact of accomplishing the
    change.
  source_metadata:
    vulnerability_id: V-223837
    rule_id: SV-223837r958726_rule
    rule_version: RACF-TS-000020
    check_id: C-25510r515199_chk
    fix_id: F-25498r515200_fix
    cci: CCI-002235
