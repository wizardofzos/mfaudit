    coverage: MANUAL
    evidence_note: Collect the SYS1.UADS user-ID inventory and the approved emergency-ID register. IRRDBU00
      contains RACF users, not UADS accounts.
- control_id: STIG-V-223856
  title: IBM z/OS UID(0) must be properly assigned.
  severity: high
  requirement: |-
    Discussion:
    To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated to prevent potential misuse and compromise of the system.

    Organizational users include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following:

    1) Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can be performed on the information system without identification or authentication; and

    2) Accesses that occur through authorized use of group authenticators without individual authentication. Organizations may require unique identification of individuals in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.

    Check procedure:
    From a z/OS command screen enter:
    SR CLASS(USER) UID(0)

     If UID(0) is assigned only to system tasks such as the z/OS/ UNIX kernel (i.e., OMVS), z/OS UNIX daemons (e.g., inetd, syslogd, ftpd), and other system software daemons, this is not a finding.

     If UID(0) is assigned to security administrators who create or maintain user account definitions; and to systems programming accounts dedicated to maintenance (e.g., SMP/E) of HFS-based components, this not a finding.

    NOTE: The assignment of UID(0) confers full time superuser privileges. This is not appropriate for personal user accounts. Access to the BPX.SUPERUSER resource is used to allow personal user accounts to gain short-term access to superuser privileges.

     If UID(0) is assigned to non-systems or non-maintenance accounts, this is a finding.
  stig:
    rule_id: SV-223856r958482_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-US-000190
    reference: V-223856 | SV-223856r958482_rule | CCI-000764
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.userOMVS
    logic: |
      omvs = irrdbu00.userOMVS.copy()
      uid0 = omvs[
          omvs['USOMVS_UID'].fillna('').astype(str).str.fullmatch(r'0+')
      ].copy()
      uid0 = uid0.merge(
          irrdbu00.users[
              [
                  'USBD_NAME', 'USBD_SPECIAL', 'USBD_OPER',
                  'USBD_REVOKE', 'USBD_NOPWD'
              ]
          ],
          left_on='USOMVS_NAME',
          right_on='USBD_NAME',
          how='left'
      )
      findings = uid0[
          [
              'USOMVS_NAME', 'USOMVS_UID', 'USBD_SPECIAL',
              'USBD_OPER', 'USBD_REVOKE', 'USBD_NOPWD'
          ]
      ].sort_values('USOMVS_NAME').to_dict('records')
      count = len(uid0)
      status = 'PASS' if count == 0 else 'REVIEW'
      detail = (
          'No UID(0) assignments found' if count == 0 else
          f'Validate {count} UID(0) assignment(s) against approved system-task, '
          'security-administration, and system-programming roles'
      )
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Assign UID(0) as specified below:
    UID(0) is assigned only to system tasks such as the z/OS UNIX kernel (i.e., OMVS), z/OS UNIX daemons (e.g., inetd, syslogd, ftpd), and other system software daemons.

    UID(0) is assigned to security administrators who create or maintain user account definitions; and to systems programming accounts dedicated to maintenance (e.g., SMP/E) of HFS-based components.

    NOTE: The assignment of UID(0) confers full time superuser privileges, this is not appropriate for personal user accounts. Access to the BPX.SUPERUSER resource is used to allow personal user accounts to gain short-term access to superuser privileges.
  source_metadata:
    vulnerability_id: V-223856
    rule_id: SV-223856r958482_rule
    rule_version: RACF-US-000190
    check_id: C-25529r621705_chk
    fix_id: F-25517r515257_fix
    cci: CCI-000764
    documentable: 'false'
    coverage: HYBRID
    evidence_note: UID(0) assignments are enumerated automatically; organizational role appropriateness
      requires review.
