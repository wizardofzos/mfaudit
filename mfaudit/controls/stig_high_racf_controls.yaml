controls:
- control_id: STIG-V-223649
  title: IBM RACF must limit Write or greater access to SYS1.NUCLEUS to system programmers only.
  severity: high
  requirement: |-
    Discussion:
    This data set contains a large portion of the system initialization (IPL) programs and pointers to the master and alternate master catalog. Unauthorized access could result in the compromise of the operating system environment, ACP, and customer data.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000259-GPOS-00100, SRG-OS-000324-GPOS-00125

    Check procedure:
    Execute a dataset access list for SYS1.NUCLEUS.

    If all of the Following are untrue, this is not a finding.

    If any of the following is true, this is a finding.

    -The ACP data set rules for SYS1.NUCLEUS do not restrict WRITE or greater access to only z/OS systems programming personnel.
    -The ACP data set rules for SYS1.NUCLEUS do not specify that all (i.e., failures and successes) WRITE or greater access will be logged.
  stig:
    rule_id: SV-223649r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000010
    reference: V-223649 | SV-223649r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      target = 'SYS1.NUCLEUS'
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      all_profiles = irrdbu00.datasets
      profiles = all_profiles[all_profiles['DSBD_NAME'] == target].copy()
      if profiles.empty:
          def matches(pattern, value):
              expression = re.escape(str(pattern))
              expression = expression.replace(r'\*\*', '.*')
              expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
              return re.fullmatch(expression, value) is not None

          candidates = all_profiles[
              all_profiles['DSBD_NAME'].map(lambda pattern: matches(pattern, target))
          ].copy()
          if not candidates.empty:
              candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                  '*', '', regex=False
              ).str.replace('%', '', regex=False).str.len()
              best = candidates['_specificity'].max()
              profiles = candidates[candidates['_specificity'] == best].copy()
      access = irrdbu00.datasetAccess
      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = []
      hard_issues = []
      review_rows = 0
      unapproved_rows = 0

      if profiles.empty:
          hard_issues.append('No covering RACF data-set profile was found')
          findings.append({
              'DSBD_NAME': target, 'DSBD_UACC': 'MISSING',
              'DSBD_AUDIT_LEVEL': 'MISSING', 'DSBD_AUDIT_OKQUAL': 'MISSING',
              'DSACC_AUTH_ID': '', 'AUTH_TYPE': '', 'DSACC_ACCESS': '', 'APPROVED': ''
          })
      else:
          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              audit_level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              audit_qual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              uacc_ok = ranks.get(uacc, 99) <= ranks['READ']
              audit_ok = (
                  audit_level == 'ALL' and
                  ranks.get(audit_qual, 99) <= ranks['UPDATE']
              )
              if not uacc_ok:
                  hard_issues.append(f'UACC={uacc} exceeds READ')
              if not audit_ok:
                  hard_issues.append(
                      f'AUDIT={audit_level}({audit_qual or "NONE"}) does not log '
                      f'all successful and failed UPDATE-or-greater access'
                  )

              related = access[
                  (access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['UPDATE']
                  )
              ]
              review_rows += len(related)
              if related.empty:
                  findings.append({
                      'DSBD_NAME': profile['DSBD_NAME'],
                      'DSBD_UACC': uacc,
                      'DSBD_AUDIT_LEVEL': audit_level,
                      'DSBD_AUDIT_OKQUAL': audit_qual,
                      'DSACC_AUTH_ID': '',
                      'AUTH_TYPE': '',
                      'DSACC_ACCESS': '',
                      'APPROVED': ''
                  })
              else:
                  for _, permit in related.iterrows():
                      appr = _approved(permit['DSACC_AUTH_ID'])
                      if appr != 'YES':
                          unapproved_rows += 1
                      findings.append({
                          'DSBD_NAME': profile['DSBD_NAME'],
                          'DSBD_UACC': uacc,
                          'DSBD_AUDIT_LEVEL': audit_level,
                          'DSBD_AUDIT_OKQUAL': audit_qual,
                          'DSACC_AUTH_ID': permit['DSACC_AUTH_ID'],
                          'AUTH_TYPE': auth_type(permit['DSACC_AUTH_ID']),
                          'DSACC_ACCESS': permit['DSACC_ACCESS'],
                          'APPROVED': appr
                      })

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = target + ': ' + '; '.join(hard_issues)
      elif unapproved_rows:
          status = 'REVIEW'
          detail = (
              f'RACF profile settings for {target} meet the technical thresholds; '
              f'validate {unapproved_rows} permit(s) not in the system-programmer list'
          )
      elif review_rows:
          status = 'PASS'
          detail = (
              f'Write access to {target} is limited to {review_rows} approved '
              'system-programmer permit(s)'
          )
      else:
          status = 'PASS'
          detail = f'RACF profile settings for {target} meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Review access authorization to critical system files. Evaluate the impact of correcting the deficiency. Develop a plan of action and implement the changes required to protect SYS1.NUCLEUS.

    Configure the WRITE or greater access to SYS1.NUCLEUS to be limited to system programmers only and all WRITE or greater access is logged.
  source_metadata:
    vulnerability_id: V-223649
    rule_id: SV-223649r1137691_rule
    rule_version: RACF-ES-000010
    check_id: C-25322r514636_chk
    fix_id: F-25310r514637_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: Profile existence, UACC, and auditing are automated. Explicit access IDs require comparison
      with approved personnel roles.
- control_id: STIG-V-223666
  title: IBM RACF access to the System Master Catalog must be properly protected.
  severity: high
  requirement: |-
    Discussion:
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000324-GPOS-00125

    Check procedure:
    Refer to SYSCATxx member of SYS1.NUCLEUS.

    Multiple SYSCATxx members may be defined. If so, refer to Master Catalog message for IPL.

    If the member is not found, refer to the appropriate LOADxx member of SYS1.PARMLIB.

    If data set rules for the Master Catalog do not restrict greater than "READ" access to only z/OS systems programming personnel, this is a finding.

    If Products or procedures requiring system programmer access for system-level maintenance meet the following specific case, this is not a finding:
    - The batch job or procedure must be documented in the SITE Security Plan.
    - Reside in a data set that is restricted to systems programmers' access only.

    If dataset rules for the Master Catalog do not specify that all (i.e., failures and successes) greater than "READ" access will be logged, this is a finding.
  stig:
    rule_id: SV-223666r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000180
    reference: V-223666 | SV-223666r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  - mastercat_list
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      libraries = mastercat_list
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      audit_required = False
      required_audit_threshold = 'NONE'
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())
      all_profiles = irrdbu00.datasets
      all_access = irrdbu00.datasetAccess

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      def matches(pattern, value):
          expression = re.escape(str(pattern))
          expression = expression.replace(r'\*\*', '.*')
          expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
          return re.fullmatch(expression, value) is not None

      hard_issues = []
      review_access = {}
      for library in libraries:
          profiles = all_profiles[all_profiles['DSBD_NAME'] == library].copy()
          if profiles.empty:
              candidates = all_profiles[
                  all_profiles['DSBD_NAME'].map(
                      lambda pattern: matches(pattern, library)
                  )
              ].copy()
              if not candidates.empty:
                  candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                      '*', '', regex=False
                  ).str.replace('%', '', regex=False).str.len()
                  best = candidates['_specificity'].max()
                  profiles = candidates[candidates['_specificity'] == best].copy()

          if profiles.empty:
              hard_issues.append(f'{library}: no covering RACF profile')
              continue

          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              okqual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              if ranks.get(uacc, 99) > ranks['READ']:
                  hard_issues.append(f'{library}: UACC={uacc}')
              if audit_required and not (
                  level == 'ALL' and
                  ranks.get(okqual, 99) <= ranks[required_audit_threshold]
              ):
                  hard_issues.append(
                      f'{library}: AUDIT={level}({okqual or "NONE"})'
                  )

              related = all_access[
                  (all_access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      all_access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['UPDATE']
                  )
              ]
              for _, permit in related.iterrows():
                  auth_id = str(permit['DSACC_AUTH_ID']).upper()
                  access = str(permit['DSACC_ACCESS']).upper()
                  item = review_access.setdefault(auth_id, {
                      'auth_type': auth_type(auth_id),
                      'max_access': access,
                      'libraries': set(),
                  })
                  if ranks.get(access, -1) > ranks.get(item['max_access'], -1):
                      item['max_access'] = access
                  item['libraries'].add(library)

      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = [
          {
              'AUTH_ID': auth_id,
              'AUTH_TYPE': item['auth_type'],
              'MAX_ACCESS': item['max_access'],
              'LIBRARY_COUNT': len(item['libraries']),
              'LIBRARIES': ', '.join(sorted(item['libraries'])),
              'APPROVED': _approved(auth_id),
          }
          for auth_id, item in sorted(review_access.items())
      ]
      unapproved = [f for f in findings if f['APPROVED'] != 'YES']

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = (
              f'{len(hard_issues)} master catalog protection issue(s): ' +
              '; '.join(hard_issues[:10]) +
              ('; ...' if len(hard_issues) > 10 else '') +
              f'; {len(unapproved)} unique UPDATE-or-greater '
              'user/group ID(s) require validation'
          )
      elif unapproved:
          status = 'REVIEW'
          detail = (
              f'master catalog profile settings meet technical thresholds; validate '
              f'{len(unapproved)} unique UPDATE-or-greater '
              'user/group ID(s) not in the system-programmer list'
          )
      elif findings:
          status = 'PASS'
          detail = (
              f'master catalog write access is limited to {len(findings)} approved '
              'system-programmer ID(s)'
          )
      else:
          status = 'PASS'
          detail = f'All {len(libraries)} master catalog entries meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Review access authorization to critical system files.

    Evaluate the impact of correcting the deficiency.

    Develop a plan of action and implement the changes as required to protect the MASTER CATALOG.

    Configure the ESM rules for system catalog to only allow access above "READ" to systems programmers and those authorized by the ISSM/ISSO.

    Configure ESM rules for the master catalog to allow access above "READ" to systems programmers ONLY.

    Configure ESM rules for the master catalog to allow any products or procedures system programmer access for system-level maintenance that meets the following specific case:
    - The batch job or procedure must be documented in the SITE Security Plan.
    - Reside in a data set that is restricted to systems programmers' access only.

    All greater than read access must be logged.
  source_metadata:
    vulnerability_id: V-223666
    rule_id: SV-223666r1137691_rule
    rule_version: RACF-ES-000180
    check_id: C-25339r868801_chk
    fix_id: F-25327r868802_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: The runtime master catalog list (inventory 'master_catalog') supplies the active master
      catalog data set name(s). Profile coverage and UACC (greater than READ) are automated; unique UPDATE-or-greater
      user/group IDs are returned for role validation.
- control_id: STIG-V-223667
  title: IBM RACF must limit Write or greater access to SYS1.UADS to system programmers only, and WRITE
    or greater access must be limited to system programmer personnel and/or security personnel.
  severity: high
  requirement: |-
    Discussion:
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000324-GPOS-00125

    Check procedure:
    The ESM data set rules for SYS1.UADS restrict WRITE or Greater access to only z/OS systems programming personnel.

    The ESM data set rules for SYS1.UADS restrict READ and/or UPDATE access to z/OS systems programming personnel and/or security personnel.

    The ESM data set rules for SYS1.UADS restrict READ access to auditors as documented in Security Plan.

    The ESM data set rules for SYS1.UADS specify that all (i.e., failures and successes) data set access authorities (i.e., READ, UPDATE, ALTER, and CONTROL) will be logged.

    If all of the above are untrue, this is not a finding.

    If any of the above is true, this is a finding.
  stig:
    rule_id: SV-223667r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000190
    reference: V-223667 | SV-223667r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      target = 'SYS1.UADS'
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      all_profiles = irrdbu00.datasets
      profiles = all_profiles[all_profiles['DSBD_NAME'] == target].copy()
      if profiles.empty:
          def matches(pattern, value):
              expression = re.escape(str(pattern))
              expression = expression.replace(r'\*\*', '.*')
              expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
              return re.fullmatch(expression, value) is not None

          candidates = all_profiles[
              all_profiles['DSBD_NAME'].map(lambda pattern: matches(pattern, target))
          ].copy()
          if not candidates.empty:
              candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                  '*', '', regex=False
              ).str.replace('%', '', regex=False).str.len()
              best = candidates['_specificity'].max()
              profiles = candidates[candidates['_specificity'] == best].copy()
      access = irrdbu00.datasetAccess
      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = []
      hard_issues = []
      review_rows = 0
      unapproved_rows = 0

      if profiles.empty:
          hard_issues.append('No covering RACF data-set profile was found')
          findings.append({
              'DSBD_NAME': target, 'DSBD_UACC': 'MISSING',
              'DSBD_AUDIT_LEVEL': 'MISSING', 'DSBD_AUDIT_OKQUAL': 'MISSING',
              'DSACC_AUTH_ID': '', 'AUTH_TYPE': '', 'DSACC_ACCESS': '', 'APPROVED': ''
          })
      else:
          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              audit_level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              audit_qual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              uacc_ok = ranks.get(uacc, 99) <= ranks['NONE']
              audit_ok = (
                  audit_level == 'ALL' and
                  ranks.get(audit_qual, 99) <= ranks['READ']
              )
              if not uacc_ok:
                  hard_issues.append(f'UACC={uacc} exceeds NONE')
              if not audit_ok:
                  hard_issues.append(
                      f'AUDIT={audit_level}({audit_qual or "NONE"}) does not log '
                      f'all successful and failed READ-or-greater access'
                  )

              related = access[
                  (access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['READ']
                  )
              ]
              review_rows += len(related)
              if related.empty:
                  findings.append({
                      'DSBD_NAME': profile['DSBD_NAME'],
                      'DSBD_UACC': uacc,
                      'DSBD_AUDIT_LEVEL': audit_level,
                      'DSBD_AUDIT_OKQUAL': audit_qual,
                      'DSACC_AUTH_ID': '',
                      'AUTH_TYPE': '',
                      'DSACC_ACCESS': '',
                      'APPROVED': ''
                  })
              else:
                  for _, permit in related.iterrows():
                      appr = _approved(permit['DSACC_AUTH_ID'])
                      if appr != 'YES':
                          unapproved_rows += 1
                      findings.append({
                          'DSBD_NAME': profile['DSBD_NAME'],
                          'DSBD_UACC': uacc,
                          'DSBD_AUDIT_LEVEL': audit_level,
                          'DSBD_AUDIT_OKQUAL': audit_qual,
                          'DSACC_AUTH_ID': permit['DSACC_AUTH_ID'],
                          'AUTH_TYPE': auth_type(permit['DSACC_AUTH_ID']),
                          'DSACC_ACCESS': permit['DSACC_ACCESS'],
                          'APPROVED': appr
                      })

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = target + ': ' + '; '.join(hard_issues)
      elif unapproved_rows:
          status = 'REVIEW'
          detail = (
              f'RACF profile settings for {target} meet the technical thresholds; '
              f'validate {unapproved_rows} permit(s) not in the system-programmer list'
          )
      elif review_rows:
          status = 'PASS'
          detail = (
              f'Write access to {target} is limited to {review_rows} approved '
              'system-programmer permit(s)'
          )
      else:
          status = 'PASS'
          detail = f'RACF profile settings for {target} meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Evaluate the impact of correcting any deficiency. Develop a plan of action and implement the changes as required to protect SYS1.UADS.
    SYS1.UADS WRITE or Greater authority is limited to the systems programming staff.
    READ and/or UPDATE access should be limited to the security staff.
    READ access is limited to Auditors when included in the site security plan.
    Configure allocate access to SYS1.UADS to be limited to system programmers only, Read and Update access to SYS1.UADS to be limited to system programmer personnel and/or security personnel, and all dataset access is logged.
  source_metadata:
    vulnerability_id: V-223667
    rule_id: SV-223667r1137691_rule
    rule_version: RACF-ES-000190
    check_id: C-25340r514690_chk
    fix_id: F-25328r514691_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: Profile existence, UACC, and auditing are automated. Explicit access IDs require comparison
      with approved personnel roles.
- control_id: STIG-V-223668
  title: IBM z/OS must protect dynamic lists in accordance with proper security requirements.
  severity: high
  requirement: |-
    Discussion:
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000324-GPOS-00125

    Check procedure:
    Execute RACF command:
    RLIST FACILITY *

    If the RACF resources and/or generic equivalent identified below are defined with AUDIT(ALL(READ)) and WRITE or greater access restricted to system programming personnel, this is not a finding.

    CSVAPF.
    CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC
    CSVAPF.MVS.SETPROG.FORMAT.STATIC
    CSVDYLPA.
    CSVDYNEX.
    CSVDYNEX.LIST
    CSVDYNL.
    CSVDYNL.UPDATE.LNKLST
    CSVLLA.

    If the RACF CSVDYNEX.LIST resource and/or generic equivalent is defined with AUDIT(FAILURE(READ)SUCCESS(UPDATE)) and WRITE or greater access restricted to system programming personnel, this is not a finding.

    If the RACF CSVDYNEX.LIST resource and/or generic equivalent is defined with READ access restricted to auditors, this is not a finding.

    If the products CICS and/or CONTROL-O are on the system, the RACF access to the CSVLLA resource and/or generic equivalent will be defined with AUDIT(ALL) and UPDATE access restricted to the CICS and CONTROL-O STC userids.

    If any software product requires access to dynamic LPA updates on the system, the RACF access to the CSVDYLPA resource and/or generic equivalent will be defined with LOG and SERVICE(UPDATE) only after the product has been validated with the appropriate STIG or SRG for compliance AND receives documented and filed authorization that details the need and any accepted risks from the site ISSM or equivalent security authority.

    Note: In the above, UPDATE access can be substituted with ALTER or CONTROL. Review the permissions in the IBM documentation when specifying UPDATE.
  stig:
    rule_id: SV-223668r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000200
    reference: V-223668 | SV-223668r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.generals
    logic: |
      import re

      resources = [
          'CSVAPF.', 'CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC',
          'CSVAPF.MVS.SETPROG.FORMAT.STATIC', 'CSVDYLPA.',
          'CSVDYNEX.', 'CSVDYNEX.LIST', 'CSVDYNL.',
          'CSVDYNL.UPDATE.LNKLST', 'CSVLLA.'
      ]
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      profiles = irrdbu00.generals[
          irrdbu00.generals['GRBD_CLASS_NAME'] == 'FACILITY'
      ].copy()
      access = irrdbu00.generalAccess[
          irrdbu00.generalAccess['GRACC_CLASS_NAME'] == 'FACILITY'
      ].copy()

      def matches(pattern, resource):
          expression = re.escape(str(pattern))
          expression = expression.replace(r'\*\*', '.*').replace(r'\*', '.*')
          expression = expression.replace('%', '.')
          return re.fullmatch(expression, resource) is not None

      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = []
      hard_issues = []
      review_rows = 0
      unapproved_rows = 0
      for resource in resources:
          candidates = profiles[
              profiles['GRBD_NAME'].map(lambda pattern: matches(pattern, resource))
          ].copy()
          if candidates.empty:
              hard_issues.append(f'{resource}: no covering FACILITY profile')
              findings.append({
                  'RESOURCE': resource, 'GRBD_NAME': 'MISSING', 'GRBD_UACC': '',
                  'GRBD_AUDIT_LEVEL': '', 'GRBD_AUDIT_OKQUAL': '',
                  'GRACC_AUTH_ID': '', 'AUTH_TYPE': '', 'GRACC_ACCESS': '', 'APPROVED': ''
              })
              continue
          candidates['_specificity'] = candidates['GRBD_NAME'].str.replace(
              '*', '', regex=False
          ).str.replace('%', '', regex=False).str.len()
          profile = candidates.sort_values('_specificity', ascending=False).iloc[0]
          uacc = str(profile['GRBD_UACC']).upper()
          level = str(profile['GRBD_AUDIT_LEVEL']).upper()
          okqual = str(profile['GRBD_AUDIT_OKQUAL']).upper()
          if ranks.get(uacc, 99) > ranks['READ']:
              hard_issues.append(f'{resource}: UACC={uacc}')
          if not (level == 'ALL' and ranks.get(okqual, 99) <= ranks['READ']):
              hard_issues.append(f'{resource}: AUDIT={level}({okqual or "NONE"})')

          related = access[
              (access['GRACC_NAME'] == profile['GRBD_NAME']) &
              (
                  access['GRACC_ACCESS'].map(
                      lambda value: ranks.get(str(value).upper(), -1)
                  ) >= ranks['UPDATE']
              )
          ]
          review_rows += len(related)
          if related.empty:
              findings.append({
                  'RESOURCE': resource, 'GRBD_NAME': profile['GRBD_NAME'],
                  'GRBD_UACC': uacc, 'GRBD_AUDIT_LEVEL': level,
                  'GRBD_AUDIT_OKQUAL': okqual, 'GRACC_AUTH_ID': '',
                  'AUTH_TYPE': '',
                  'GRACC_ACCESS': '', 'APPROVED': ''
              })
          else:
              for _, permit in related.iterrows():
                  appr = _approved(permit['GRACC_AUTH_ID'])
                  if appr != 'YES':
                      unapproved_rows += 1
                  findings.append({
                      'RESOURCE': resource, 'GRBD_NAME': profile['GRBD_NAME'],
                      'GRBD_UACC': uacc, 'GRBD_AUDIT_LEVEL': level,
                      'GRBD_AUDIT_OKQUAL': okqual,
                      'GRACC_AUTH_ID': permit['GRACC_AUTH_ID'],
                      'AUTH_TYPE': auth_type(permit['GRACC_AUTH_ID']),
                      'GRACC_ACCESS': permit['GRACC_ACCESS'],
                      'APPROVED': appr
                  })

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = '; '.join(hard_issues)
      elif unapproved_rows:
          status = 'REVIEW'
          detail = (
              f'Technical profile settings pass; validate {unapproved_rows} '
              'WRITE-or-greater permit(s) not in the system-programmer list'
          )
      elif review_rows:
          status = 'PASS'
          detail = (
              f'Dynamic-list WRITE access is limited to {review_rows} approved '
              'system-programmer permit(s)'
          )
      else:
          status = 'PASS'
          detail = 'Required dynamic-list resources have restrictive profiles and auditing'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Configure the Dynamic List resources to be defined to the RACF FACILITY resource class and protected. Only system programmers and a limited number of authorized users and approved authorized Started Tasks are able to issue these commands. All access is logged.

    The required CSV-prefixed Facility Class resources are listed below. These resources or generic equivalents should be defined and permitted as required with only z/OS systems programmers and logging enabled. Minimum required list of CSV-prefixed resources:

    CSVAPF.**
    CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC
    CSVAPF.MVS.SETPROG.FORMAT.STATIC
    CSVDYLPA.**
    CSVDYLPA.ADD.**
    CSVDYLPA.DELETE.**
    CSVDYNEX.**
    CSVDYNEX.LIST
    CSVDYNL.**
    CSVDYNL.UPDATE.LNKLST
    CSVLLA.**

    Limit authority to those resources to z/OS systems programmers. Restrict to the absolute minimum number of personnel with AUDIT(ALL(READ)) and UPDATE access.

    Sample commands are shown here to accomplish this:

    RDEF FACILITY CSVAPF.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))
    RDEF FACILITY CSVAPF.MVS.SETPROG.FORMAT.DYNAMIC.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))
    RDEF FACILITY CSVAPF.MVS.SETPROG.FORMAT.STATIC.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))

    PERMIT CSVAPF.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVAPF.MVS.SETPROG.SETPROG.FORMAT.DYNAMIC.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVAPF.MVS.SETPROG.SETPROG.FORMAT.STATIC.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)

    The CSVDYLPA.ADD resource will be permitted to products BMC Mainview, CA 1, and CA Common Services STC userids with AUDIT(ALL(READ)) and UPDATE access.

    The CSVDYLPA.DELETE resource will be permitted to products CA 1 and CA Common Services STC userids with AUDIT(ALL(READ)) and UPDATE access.

    Sample commands are shown here to accomplish one set of resources:

    RDEF FACILITY CSVDYLPA.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))
    RDEF FACILITY CSVDYLPA.ADD.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))
    RDEF FACILITY CSVDYLPA.DELETE.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))

    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(BMC Mainview STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(CA 1 STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.** CLASS(FACILITY) ID(CCS STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(BMC Mainview STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(CA 1 STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.ADD.** CLASS(FACILITY) ID(CCS STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(CA 1 STC userid) ACCESS(UPDATE)
    PERMIT CSVDYLPA.DELETE.** CLASS(FACILITY) ID(CCS STC userid) ACCESS(UPDATE)

    The CSVDYNEX.LIST resource and/or generic equivalent will be defined with AUDIT(FAILURE(READ)SUCCESS(UPDATE)) and UPDATE access restricted to system programming personnel.

    The CSVDYNEX.LIST resource and/or generic equivalent will be defined with READ access restricted to auditors.

    Sample commands are shown here to accomplish this:

    RDEF FACILITY CSVDYNEX.** UACC(NONE) OWNER(syspsmpl) -
    AUDIT(ALL(READ))
    RDEF FACILITY CSVDYNEX.LIST.** UACC(NONE) OWNER(syspsmpl) -
    AUDIT(FAILURE(READ)SUCCESS(UPDATE))

    PERMIT CSVDYNEX.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVDYNEX.LIST.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVDYNEX.LIST.** CLASS(FACILITY) ID(smplsmpl) ACCESS(READ)

    The CSVLLA resource will be permitted to CICS and CONTROL-O STC userids with AUDIT(ALL(READ)) and UPDATE access.

    Sample commands are shown here to accomplish one set of resources:

    RDEF FACILITY CSVLLA.** UACC(NONE) OWNER(syspsmpl) AUDIT(ALL(READ))

    PERMIT CSVLLA.** CLASS(FACILITY) ID(syspsmpl) ACCESS(UPDATE)
    PERMIT CSVLLA.** CLASS(FACILITY) ID(CICS STC userids) ACCESS(UPDATE)
    PERMIT CSVLLA.** CLASS(FACILITY) ID(CONTROL-O STC userid) ACCESS(UPDATE)
