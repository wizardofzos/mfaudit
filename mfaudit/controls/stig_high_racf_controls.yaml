- control_id: STIG-V-223685
  title: IBM RACF security data sets and/or databases must be properly protected.
  severity: high
  requirement: |-
    Discussion:
    The External Security Manager (ESM) database files contain all access control information for the operating system environment and system resources. Unauthorized access could result in the compromise of the operating system environment, ACP, and customer data.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000134-GPOS-00068, SRG-OS-000259-GPOS-00100, SRG-OS-000324-GPOS-00125

    Check procedure:
    If the following accesses to the ESM security data sets and/or databases are properly restricted as detailed below, this is not a finding.

    -The ESM data set rules for ESM security data sets and/or databases restrict READ access to auditors and DASD batch.
    -The ESM data set rules for ESM security data sets and/or databases restrict READ and/or greater access to z/OS systems programming personnel, security personnel, and/or batch jobs that perform ESM maintenance.

    All (i.e., failures and successes) data set access authorities (i.e., READ, UPDATE, ALTER, and CONTROL) for ESM security data sets and/or databases are logged.
  stig:
    rule_id: SV-223685r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000370
    reference: V-223685 | SV-223685r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  - racfdb_list
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      libraries = racfdb_list
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      audit_required = True
      required_audit_threshold = 'READ'
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())
      all_profiles = irrdbu00.datasets
      all_access = irrdbu00.datasetAccess

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      def matches(pattern, value):
          expression = re.escape(str(pattern))
          expression = expression.replace(r'\*\*', '.*')
          expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
          return re.fullmatch(expression, value) is not None

      hard_issues = []
      review_access = {}
      for library in libraries:
          profiles = all_profiles[all_profiles['DSBD_NAME'] == library].copy()
          if profiles.empty:
              candidates = all_profiles[
                  all_profiles['DSBD_NAME'].map(
                      lambda pattern: matches(pattern, library)
                  )
              ].copy()
              if not candidates.empty:
                  candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                      '*', '', regex=False
                  ).str.replace('%', '', regex=False).str.len()
                  best = candidates['_specificity'].max()
                  profiles = candidates[candidates['_specificity'] == best].copy()

          if profiles.empty:
              hard_issues.append(f'{library}: no covering RACF profile')
              continue

          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              okqual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              if ranks.get(uacc, 99) > ranks['NONE']:
                  hard_issues.append(f'{library}: UACC={uacc}')
              if audit_required and not (
                  level == 'ALL' and
                  ranks.get(okqual, 99) <= ranks[required_audit_threshold]
              ):
                  hard_issues.append(
                      f'{library}: AUDIT={level}({okqual or "NONE"})'
                  )

              related = all_access[
                  (all_access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      all_access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['READ']
                  )
              ]
              for _, permit in related.iterrows():
                  auth_id = str(permit['DSACC_AUTH_ID']).upper()
                  access = str(permit['DSACC_ACCESS']).upper()
                  item = review_access.setdefault(auth_id, {
                      'auth_type': auth_type(auth_id),
                      'max_access': access,
                      'libraries': set(),
                  })
                  if ranks.get(access, -1) > ranks.get(item['max_access'], -1):
                      item['max_access'] = access
                  item['libraries'].add(library)

      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = [
          {
              'AUTH_ID': auth_id,
              'AUTH_TYPE': item['auth_type'],
              'MAX_ACCESS': item['max_access'],
              'LIBRARY_COUNT': len(item['libraries']),
              'LIBRARIES': ', '.join(sorted(item['libraries'])),
              'APPROVED': _approved(auth_id),
          }
          for auth_id, item in sorted(review_access.items())
      ]
      unapproved = [f for f in findings if f['APPROVED'] != 'YES']

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = (
              f'{len(hard_issues)} RACF database protection issue(s): ' +
              '; '.join(hard_issues[:10]) +
              ('; ...' if len(hard_issues) > 10 else '') +
              f'; {len(unapproved)} unique READ-or-greater '
              'user/group ID(s) require validation'
          )
      elif unapproved:
          status = 'REVIEW'
          detail = (
              f'RACF database profile settings meet technical thresholds; validate '
              f'{len(unapproved)} unique READ-or-greater '
              'user/group ID(s) not in the system-programmer list'
          )
      elif findings:
          status = 'PASS'
          detail = (
              f'RACF database write access is limited to {len(findings)} approved '
              'system-programmer ID(s)'
          )
      else:
          status = 'PASS'
          detail = f'All {len(libraries)} RACF database entries meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Review access authorization to critical security database files. Evaluate the impact of correcting the deficiency. Develop a plan of action and implement the changes required to protect the ESM files.

    Configure READ and/or greater access to all ESM files and/or databases are limited to system programmers and/or security personnel, and/or batch jobs that perform ESM maintenance. READ access can be given to auditors and DASD batch. All accesses to ESM files and/or databases are logged.
  source_metadata:
    vulnerability_id: V-223685
    rule_id: SV-223685r1137691_rule
    rule_version: RACF-ES-000370
    check_id: C-25358r514744_chk
    fix_id: F-25346r514745_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: The runtime RACF database list (inventory 'racf_db') supplies the primary/backup RACF
      database data sets. Profile coverage, UACC(NONE), and READ-or-greater auditing are automated; unique
      READ-or-greater user/group IDs are returned for role validation.
