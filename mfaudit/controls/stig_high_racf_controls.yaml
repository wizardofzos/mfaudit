- control_id: STIG-V-223704
  title: The IBM RACF PROTECTALL SETROPTS value specified must be properly set.
  severity: high
  requirement: |-
    Discussion:
    Configuring the operating system to implement organization-wide security implementation guides and security checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects the most restrictive security posture consistent with operational requirements.

    Configuration settings are the set of parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the system, including the parameters required to satisfy other security control requirements. Security-related parameters include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports, protocols, services, and remote connections.

    Check procedure:
    From the ISPF Command Shell enter:
    SETROPTS LIST

    If the SETROPTS values for PROTECTALL is ACTIVE and set to FAIL, this is not a finding.

    If the SETROPTS PROTECTALL parameter is set to NOPROTECTALL or PROTECTALL(WARNING), this is a finding.

    Additional analysis may be required to determine whether this finding should be downgraded to a Category II or remain a Category I.

    Example of a Category I finding where not a further analysis is required:

    Control Options: SETROPTS NOPROTECTALL

    Example of a possible Category I finding requiring additional analysis:

    Control Options: SETROPTS PROTECTALL(WARNING)

    PROTECTALL(WARNING) allows access to a data set only if it is not at protected by a profile in the DATASET resource class. Therefore if all sensitive data sets are properly protected by profiles in the DATASET resource class, PROTECTALL(WARNING) will not at allow unauthorized access. This situation allows for a downgrade to a Category II.
  stig:
    rule_id: SV-223704r991589_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000570
    reference: V-223704 | SV-223704r991589_rule | CCI-000366
  data_sources_needed:
  - setropts
  implementation:
    engine: python
    dataset: setropts.fieldInfo
    logic: |
      row = df[df['Setting'] == 'PROTALL']
      value = str(row.iloc[0]['Value']).upper() if len(row) else 'OFF'
      status = 'PASS' if value == 'FAILURES' else 'FAIL'
      detail = f'PROTALL={value} (required: FAILURES)'
      findings = [{'Setting': 'PROTALL', 'Value': value}]
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Evaluate the impact associated with implementation of the control option. Develop a plan of action to implement the control option as specified in the example below:

    The RACF Command SETR LIST will show the status of RACF Controls including the value for the PROTECTALL Option.

    PROTECTALL is ACTIVATED and set to FAIL by issuing the command SETR PROTECTALL(FAIL).
  source_metadata:
    vulnerability_id: V-223704
    rule_id: SV-223704r991589_rule
    rule_version: RACF-ES-000570
    check_id: C-25377r514800_chk
    fix_id: F-25365r514801_fix
    cci: CCI-000366
    documentable: 'false'
    coverage: AUTOMATED
    evidence_note: PROTECTALL mode is available directly from SETROPTS.
- control_id: STIG-V-223729
  title: NIST FIPS-validated cryptography must be used to protect passwords in the security database.
  severity: high
  requirement: |-
    Discussion:
    Password complexity is one factor of several that determines how long it takes to crack a password. The more complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.

    Operating systems utilizing encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules.

    Satisfies: SRG-OS-000073-GPOS-00041, SRG-OS-000074-GPOS-00042, SRG-OS-000120-GPOS-00061

    Check procedure:
    From the ISPF Command Shell enter:
    SETRopts List

    If the following is specified under PASSWORD PROCESSING OPTIONS: THE ACTIVE PASSWORD ENCRYPTION ALGORITHM IS KDFAES, this is not a finding.
  stig:
    rule_id: SV-223729r998355_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000820
    reference: V-223729 | SV-223729r998355_rule | CCI-004062
  data_sources_needed:
  - setropts
  implementation:
    engine: python
    dataset: setropts.fieldInfo
    logic: |
      row = df[df['Setting'] == 'PWDALG']
      value = str(row.iloc[0]['Value']).upper() if len(row) else 'NOT SET'
      status = 'PASS' if value == 'KDFAES' else 'FAIL'
      detail = f'PWDALG={value} (required: KDFAES)'
      findings = [{'Setting': 'PWDALG', 'Value': value}]
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Evaluate the impact associated with implementation of the control option. Develop a plan of action to implement the control option as specified below:

    For z/OS release 1.12 through z/OS release 2.1 APARs OA43998 and OA43999 must be applied.

    Set the passwords option for algorithm to KDFAES.

    Sample syntax to activate:
    SETRopts PASSWORD(ALGORITHM(KDFAES))
  source_metadata:
    vulnerability_id: V-223729
    rule_id: SV-223729r998355_rule
    rule_version: RACF-ES-000820
    check_id: C-25402r514875_chk
    fix_id: F-25390r514876_fix
    cci: CCI-004062
    documentable: 'false'
    coverage: AUTOMATED
    evidence_note: The active password algorithm is available from SETROPTS.
