  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Configure ESM dataset rules to restrict all WRITE and/or greater access to all PROCLIBs referenced in the Master JCL and JES2 or JES3 procedure for started tasks (STCs) and TSO logons to systems programming personnel only.

    Suggestion on how to update system to be compliant with this vulnerability:

    NOTE: All examples are only examples and may not reflect your operating environment.

    Obtain only the PROCLIB data sets that contain STC and TSO procedures. The data sets to be reviewed are obtained using the following steps:

    - All data sets contained in the MSTJCLxx member in the DD statement concatenation for IEFPDSI and IEFJOBS.
    - The data set in the PROCxx DD statement concatenation that is within the JES2 procedure or identified in the JES2 dynamic PROCLIB definitions. The specific PROCxx DD statement that is used is obtained from the PROCLIB entry for the JOBCLASSes of STC and TSU. The following are the data sets the process will obtain for analysis:

    MSTJCL00

    //MSTJCL00 JOB MSGLEVEL=(1,1),TIME=1440
    //EXEC PGM=IEEMB860,DPRTY=(15,15)
    //STCINRDR DD SYSOUT=(A,INTRDR)
    //TSOINRDR DD SYSOUT=(A,INTRDR)
    //IEFPDSI DD DSN=SYS3.PROCLIB,DISP=SHR <<===
    //DD DSN=SYS2.PROCLIB,DISP=SHR <<===
    //DD DSN=SYS1.PROCLIB,DISP=SHR <<===
    //SYSUADS DD DSN=SYS1.UADS,DISP=SHR
    //SYSLBC DD DSN=SYS1.BRODCAST,DISP=SHR

    JES2

    //JES2 PROC
    //IEFPROC EXEC PGM=HASJES20,PARM=NOREQ,
    //DPRTY=(15,15),TIME=1440,PERFORM=9
    //ALTPARM DD DISP=SHR,
    //DSN=SYS1.PARMLIB(JES2BKUP)
    //HASPPARM DD DISP=SHR,
    //DSN=SYS1.PARMLIB(JES2PARM)
    //PROC00 DD DSN=SYS3.PROCLIB,DISP=SHR <<===
    //DD DSN=SYS2.PROCLIB,DISP=SHR <<===
    //DD DSN=SYS1.PROCLIB,DISP=SHR <<===
    //PROC01 DD DSN=SYS4.USERPROC,DISP=SHR
    //DD DSN=SYS3.PROCLIB,DISP=SHR
    //DD DSN=SYS2.PROCLIB,DISP=SHR
    //DD DSN=SYS1.PROCLIB,DISP=SHR
    //IEFRDER DD SYSOUT=*
    //HASPLIST DD DDNAME=IEFRDER

    JES2 initialization parameter JOBCLASS PROCLIB entries

    JOBCLASS(*) ACCT=NO, /* ACCT # NOT REQUIRED (DEF.)*/
    ...
    PROCLIB=01, /* DEFAULT TO //PROC01 DD (DEF.)*/
    ...
    JOBCLASS(STC) AUTH=ALL, /* ALLOW ALL COMMANDS (DEF.)*/
    ...
    PROCLIB=00, /* USE //PROC00 DD (DEF.)*/
    ...
    JOBCLASS(TSU) AUTH=ALL, /* ALLOW ALL COMMANDS (DEF.)*/
    ...
    PROCLIB=00, /* USE //PROC00 DD (DEF.)*/
    ...

    PROCLIB data set that will be used in the access authorization process:

    SYS3.PROCLIB
    SYS2.PROCLIB
    SYS1.PROCLIB

    The following PROCLIB data set will NOT be used or evaluated:
    SYS4.USERPROC

    Recommendation for sites:

    The following are recommendations for the sites to ensure only PROCLIB data sets that contain the STC and TSO procedures are protected.

    - Remove all application PROCLIB data sets from MSTJCLxx and JES2 procedures. The customer will have all JCL changed to use the JCLLIB JCL statement to refer to the application PROCLIB data sets.

    Example:
    //USERPROC JCLLIB ORDER=(SYS4.USERPROC)

    - Remove all access to the application PROCLIB data sets and only authorize system programming personnel WRITE and/or greater access to these data sets.

    - Document the application PROCLIB data set access for the customers that require WRITE and/or greater access. Use this documentation as justification for the inappropriate access created by the scripts.

    - Change MSTJCLxx and JES2 procedure to identify STC and TSO PROCLIB data sets separate from application PROCLIB data sets. The following is a list of actions that can be performed to accomplish this recommendation:

    a. Ensure that MSTJCLxx contains only PROCLIB data sets that contain STC and TSO procedures.
    b. If an application PROCLIB data set is required for JES2, ensure that the JES2 procedure specifies more than one PROCxx DD statement concatenation or identified in the JES2 dynamic PROCLIB definitions. Identify one PROCxx DD statement data set concatenation that contains the STC and TSO PROCLIB data sets. Identify one or more additional PROCxx DD statements that can contain any other PROCLIB data sets. The concatenation of the additional PROCxx DD statements can contain the same data sets that are identified in the PROCxx DD statement for STC and TSO. The following is an example of the JES2 procedure:

    //JES2 PROC
    //IEFPROC EXEC PGM=HASJES20,PARM=NOREQ,
    //DPRTY=(15,15),TIME=1440,PERFORM=9
    //ALTPARM DD DISP=SHR,
    //DSN=SYS1.PARMLIB(JES2BKUP)
    //HASPPARM DD DISP=SHR,
    //DSN=SYS1.PARMLIB(JES2PARM)
    //PROC00 DD DSN=SYS3.PROCLIB,DISP=SHR
    //DD DSN=SYS2.PROCLIB,DISP=SHR
    //DD DSN=SYS1.PROCLIB,DISP=SHR
    //PROC01 DD DSN=SYS4.USERPROC,DISP=SHR
    //DD DSN=SYS3.PROCLIB,DISP=SHR
    //DD DSN=SYS2.PROCLIB,DISP=SHR
    //DD DSN=SYS1.PROCLIB,DISP=SHR
    //IEFRDER DD SYSOUT=*
    //HASPLIST DD DDNAME=IEFRDER

    c. Ensure that the JES2 configuration file is changed to specify that the PROCLIB entry for the STC and TSU JOBCLASSes point to the proper PROCxx entry within the JES2 procedure or JES2 dynamic PROCLIB definitions that contain the STC and/or TSO procedures. All other JOBCLASSes can specify a PROCLIB entry that uses the same PROCxx or any other PROCxx DD statement identified in the JES2 procedure or identified in the JES2 dynamic PROCLIB definitions. The following is an example of the JES2 initialization parameters:

    JOBCLASS(*) ACCT=NO, /* ACCT # NOT REQUIRED (DEF.)*/
    ...
    PROCLIB=01, /* DEFAULT TO //PROC01 DD (DEF.)*/
    ...
    JOBCLASS(STC) AUTH=ALL, /* ALLOW ALL COMMANDS (DEF.)*/
    ...
    PROCLIB=00, /* USE //PROC00 DD (DEF.)*/
    ...
    JOBCLASS(TSU) AUTH=ALL, /* ALLOW ALL COMMANDS (DEF.)*/
    ...
    PROCLIB=00, /* USE //PROC00 DD (DEF.)*/
    ...

    d. Ensure that only system programming personnel are authorized WRITE and/or greater access to PROCLIB data sets that contain STC and TSO procedures.
  source_metadata:
    vulnerability_id: V-223687
    rule_id: SV-223687r1137691_rule
    rule_version: RACF-ES-000390
    check_id: C-25360r869468_chk
    fix_id: F-25348r868815_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: HYBRID
    evidence_note: The runtime --proclib-list supplies the active STC and TSO procedure libraries. Profile
      coverage and UACC are automated; unique UPDATE-or-greater user/group IDs require validation as systems
      programming personnel.
- control_id: STIG-V-223697
  title: IBM z/OS SYS1.PARMLIB must be properly protected.
  severity: high
  requirement: |-
    Discussion:
    Without the capability to restrict which roles and individuals can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for one.

    SYS1.PARMLIB contains the parameters that control audit configuration. Unauthorized access could result in the compromise of the operating system environment, ACP, and customer data.

    Satisfies: SRG-OS-000063-GPOS-00032, SRG-OS-000080-GPOS-00048, SRG-OS-000259-GPOS-00100, SRG-OS-000324-GPOS-00125, SRG-OS-000337-GPOS-00129, SRG-OS-000362-GPOS-00149

    Check procedure:
    Execute a dataset list of access to SYS1.PARMLIB.

    If the ESM data set rules for SYS1.PARMLIB allow inappropriate (e.g., global READ) access, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ, WRITE or greater access to only systems programming personnel, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ and UPDATE access to only domain level security administrators, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ access to only system Level Started Tasks, authorized Data Center personnel, and auditors, this is a finding.

    If data set rules for SYS1.PARMLIB do not specify that all (i.e., failures and successes) UPDATE and/or ALTER access will be logged, this is a finding.
  stig:
    rule_id: SV-223697r998344_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000500
    reference: V-223697 | SV-223697r998344_rule | CCI-000171
  data_sources_needed:
  - irrdbu00
  - parmlib_list
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      libraries = parmlib_list
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      audit_required = True
      required_audit_threshold = 'UPDATE'
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())
      all_profiles = irrdbu00.datasets
      all_access = irrdbu00.datasetAccess

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      def matches(pattern, value):
          expression = re.escape(str(pattern))
          expression = expression.replace(r'\*\*', '.*')
          expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
          return re.fullmatch(expression, value) is not None

      hard_issues = []
      review_access = {}
      for library in libraries:
          profiles = all_profiles[all_profiles['DSBD_NAME'] == library].copy()
          if profiles.empty:
              candidates = all_profiles[
                  all_profiles['DSBD_NAME'].map(
                      lambda pattern: matches(pattern, library)
                  )
              ].copy()
              if not candidates.empty:
                  candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                      '*', '', regex=False
                  ).str.replace('%', '', regex=False).str.len()
                  best = candidates['_specificity'].max()
                  profiles = candidates[candidates['_specificity'] == best].copy()

          if profiles.empty:
              hard_issues.append(f'{library}: no covering RACF profile')
              continue

          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              okqual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              if ranks.get(uacc, 99) > ranks['NONE']:
                  hard_issues.append(f'{library}: UACC={uacc}')
              if audit_required and not (
                  level == 'ALL' and
                  ranks.get(okqual, 99) <= ranks[required_audit_threshold]
              ):
                  hard_issues.append(
                      f'{library}: AUDIT={level}({okqual or "NONE"})'
                  )

              related = all_access[
                  (all_access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      all_access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['UPDATE']
                  )
              ]
              for _, permit in related.iterrows():
                  auth_id = str(permit['DSACC_AUTH_ID']).upper()
                  access = str(permit['DSACC_ACCESS']).upper()
                  item = review_access.setdefault(auth_id, {
                      'auth_type': auth_type(auth_id),
                      'max_access': access,
                      'libraries': set(),
                  })
                  if ranks.get(access, -1) > ranks.get(item['max_access'], -1):
                      item['max_access'] = access
                  item['libraries'].add(library)

      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = [
          {
              'AUTH_ID': auth_id,
              'AUTH_TYPE': item['auth_type'],
              'MAX_ACCESS': item['max_access'],
              'LIBRARY_COUNT': len(item['libraries']),
              'LIBRARIES': ', '.join(sorted(item['libraries'])),
              'APPROVED': _approved(auth_id),
          }
          for auth_id, item in sorted(review_access.items())
      ]
      unapproved = [f for f in findings if f['APPROVED'] != 'YES']

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = (
              f'{len(hard_issues)} PARMLIB protection issue(s): ' +
              '; '.join(hard_issues[:10]) +
              ('; ...' if len(hard_issues) > 10 else '') +
              f'; {len(unapproved)} unique UPDATE-or-greater '
              'user/group ID(s) require validation'
          )
      elif unapproved:
          status = 'REVIEW'
          detail = (
              f'PARMLIB profile settings meet technical thresholds; validate '
              f'{len(unapproved)} unique UPDATE-or-greater '
              'user/group ID(s) not in the system-programmer list'
          )
      elif findings:
          status = 'PASS'
          detail = (
              f'PARMLIB write access is limited to {len(findings)} approved '
              'system-programmer ID(s)'
          )
      else:
          status = 'PASS'
          detail = f'All {len(libraries)} PARMLIB entries meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Configure access rules for SYS1.PARMLIB as follows:

    Systems programming personnel will be authorized to WRITE or greater the SYS1.PARMLIB concatenation.

    Domain level security administrators can be authorized to update the SYS1.PARMLIB concatenation.

    System Level Started Tasks, authorized Data Center personnel, and auditor can be authorized read access by the information system security officer (ISSO).

    All WRITE or greater access is logged.
  source_metadata:
    vulnerability_id: V-223697
    rule_id: SV-223697r998344_rule
    rule_version: RACF-ES-000500
    check_id: C-25370r514779_chk
    fix_id: F-25358r998343_fix
    cci: CCI-000171
    documentable: 'false'
    coverage: HYBRID
    evidence_note: The runtime --parmlib-list supplies the active PARMLIB concatenation. Profile coverage,
      UACC, and UPDATE-or-greater auditing are automated; unique UPDATE-or-greater user/group IDs are
      returned for role validation.
- control_id: STIG-V-223703
  title: IBM RACF must define WARN = NO on all profiles.
  severity: high
  requirement: |-
    Discussion:
    Failure to restrict system access to authenticated users negatively impacts operating system security.

    Check procedure:
    Review all Dataset and resource profiles in the RACF database.

    If any are not defined with WARN = NO, this is a finding.
  stig:
    rule_id: SV-223703r991591_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000560
    reference: V-223703 | SV-223703r991591_rule | CCI-000366
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      dataset_warn = irrdbu00.datasets[irrdbu00.datasets['DSBD_WARNING'] == 'YES']
      general_warn = irrdbu00.generals[irrdbu00.generals['GRBD_WARNING'] == 'YES']
      findings = (
          [
              {'PROFILE_TYPE': 'DATASET', 'CLASS': 'DATASET', 'NAME': row['DSBD_NAME']}
              for _, row in dataset_warn.iterrows()
          ] +
          [
              {
                  'PROFILE_TYPE': 'GENERAL', 'CLASS': row['GRBD_CLASS_NAME'],
                  'NAME': row['GRBD_NAME']
              }
              for _, row in general_warn.iterrows()
          ]
      )
      count = len(findings)
      status = 'PASS' if count == 0 else 'FAIL'
      detail = f'{count} RACF profile(s) have WARNING mode enabled'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
