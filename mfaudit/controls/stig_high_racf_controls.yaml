  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = 'Additional evidence required for V-223679: Collect active static and dynamic exits with their load-library data sets (for example system exit displays plus module-to-library inventory).'
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    Using the ESM, protect the data sets associated with all product exits installed in the z/OS environment. This reduces the potential of a hacker adding a routine to a library and possibly creating an exposure. Confirm that all exits are tracked using a CMP. Develop usermods to include the source/object code used to support the exits. Have systems programming personnel review all z/OS and other product exits to confirm that the exits are required and are correctly installed.

    Configure ESM Dataset rules for all WRITE or greater access to libraries containing z/OS and other system-level exits will be logged using the ACP's facilities. Only systems programming personnel will be authorized to update the libraries containing z/OS and other system-level exits.
  source_metadata:
    vulnerability_id: V-223679
    rule_id: SV-223679r1137691_rule
    rule_version: RACF-ES-000310
    check_id: C-25352r868809_chk
    fix_id: F-25340r868810_fix
    cci: CCI-000213
    documentable: 'false'
    coverage: MANUAL
    evidence_note: Collect active static and dynamic exits with their load-library data sets (for example
      system exit displays plus module-to-library inventory).
