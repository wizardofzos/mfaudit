- control_id: STIG-V-223777
  title: IBM RACF must define UACC of NONE on all profiles.
  severity: high
  requirement: |-
    Discussion:
    The operating system must employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs.

    Check procedure:
    Review all Dataset and resource profiles in the RACF database.

    If any are not defined with UACC NONE, this is a finding.

    There is an exception when evaluating the UACC for DIGTCERT and NODES resource classes.

    The universal access (UACC) for DIGTCERT profiles:
    For profiles in classes other than DIGTCERT, the valid values are NONE, READ, EXECUTE, UPDATE, CONTROL, and ALTER. For DIGTCERT profiles, the valid values are TRUST, NOTRUST, and HIGHTRST.
    If DIGTCERT Profiles are defined with other than UACC NONE, this is not a finding.

    The universal access (UACC) for NODES:
    A UACC of NONE fails the inbound job.
    If NODES profiles are defined with other than UACC NONE, this is not a finding.
  stig:
    rule_id: SV-223777r1050763_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-OS-000210
    reference: V-223777 | SV-223777r1050763_rule | CCI-001774
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      dataset_bad = irrdbu00.datasets[irrdbu00.datasets['DSBD_UACC'] != 'NONE']
      general_bad = irrdbu00.generals[
          (~irrdbu00.generals['GRBD_CLASS_NAME'].isin(['DIGTCERT', 'NODES'])) &
          (irrdbu00.generals['GRBD_UACC'] != 'NONE')
      ]
      findings = (
          [
              {
                  'PROFILE_TYPE': 'DATASET', 'CLASS': 'DATASET',
                  'NAME': row['DSBD_NAME'], 'UACC': row['DSBD_UACC']
              }
              for _, row in dataset_bad.iterrows()
          ] +
          [
              {
                  'PROFILE_TYPE': 'GENERAL', 'CLASS': row['GRBD_CLASS_NAME'],
                  'NAME': row['GRBD_NAME'], 'UACC': row['GRBD_UACC']
              }
              for _, row in general_bad.iterrows()
          ]
      )
      count = len(findings)
      status = 'PASS' if count == 0 else 'FAIL'
      detail = (
          f'{count} profile(s) have UACC other than NONE '
          '(DIGTCERT and NODES exceptions applied)'
      )
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: Define each dataset and resource profile with UACC(NONE), excluding the exceptions of NODES
    and DIGTCERT profiles.
  source_metadata:
    vulnerability_id: V-223777
    rule_id: SV-223777r1050763_rule
    rule_version: RACF-OS-000210
    check_id: C-25450r1050761_chk
    fix_id: F-25438r1050762_fix
    cci: CCI-001774
    documentable: 'false'
    coverage: AUTOMATED
    evidence_note: All data-set and general-resource UACC values are checked with the documented DIGTCERT
      and NODES exceptions.
- control_id: STIG-V-223781
  title: Unsupported system software must not be installed and/ or active on the system.
  severity: high
  requirement: |-
    Discussion:
    Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission requirements. This includes functions and services installed at the operating system level.

    Some of the programs, installed by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions, functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program execution is critical to maintaining a secure system baseline.

    Methods for complying with this requirement include restricting execution of programs in certain environments, while preventing execution in other environments; or limiting execution of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments, or roles).

    Check procedure:
    This check applies to all products that meet the following criteria:

    - Uses authorized and restricted z/OS interfaces by utilizing Authorized Program Facility (APF) authorized modules or libraries.
    - Requires access to system datasets or sensitive information or requires special or privileged authority to run.

    For the products in the above category, refer to the Vendor's support lifecycle information for current versions and releases.

    If the software products currently running on the reviewed system are at a version greater than or equal to the products listed in the vendor's Support Lifecycle information, this is not a finding.
  stig:
    rule_id: SV-223781r958804_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-OS-000250
    reference: V-223781 | SV-223781r958804_rule | CCI-001764
  data_sources_needed: []
  implementation:
    engine: python
    dataset: ''
    logic: |
      status = 'REVIEW'
      detail = "Additional evidence required for V-223781: Collect an installed/running software inventory with versions and compare it to each vendor's current support lifecycle (for example SCRT and SMP/E CSI)."
      findings = []
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
  remediation: |-
    For all products that meet the following criteria:

    - Uses authorized and restricted z/OS interfaces by utilizing Authorized Program Facility (APF) authorized modules or libraries.
    - Requires access to system datasets or sensitive information or requires special or privileged authority to run.

    The ISSO will ensure that unsupported system software for the products in the above category is removed or upgraded prior to a vendor dropping support.

    Authorized software that is NO longer supported is a CAT I vulnerability. The customer and site will be given six months to mitigate the risk, develop a supported solution, or obtain a formal letter approving such risk/software.
  source_metadata:
