    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use access control policies and enforcement mechanisms to implement this requirement.

    Satisfies: SRG-OS-000080-GPOS-00048, SRG-OS-000259-GPOS-00100, SRG-OS-000324-GPOS-00125

    Check procedure:
    Execute a dataset list of access for SYS1.LPALIB.

    If any of the following is true, this is a finding.

    -The ESM data set rules for SYS1.LPALIB do not restrict WRITE or greater access to only z/OS systems programming personnel.
    -The ESM data set rules for SYS1.LPALIB do not specify that all (i.e., failures and successes) WRITE or greater access will be logged.
  stig:
    rule_id: SV-223676r1137691_rule
    severity: high
  custom:
    benchmark: IBM z/OS RACF Security Technical Implementation Guide V9R8
    category: RACF-ES-000280
    reference: V-223676 | SV-223676r1137691_rule | CCI-000213
  data_sources_needed:
  - irrdbu00
  implementation:
    engine: python
    dataset: irrdbu00.datasets
    logic: |
      import re

      target = 'SYS1.LPALIB'
      ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
      user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
      group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())

      def auth_type(value):
          auth_id = str(value).upper()
          if auth_id in user_ids:
              return 'USER'
          if auth_id in group_ids:
              return 'GROUP'
          return 'UNRESOLVED'

      all_profiles = irrdbu00.datasets
      profiles = all_profiles[all_profiles['DSBD_NAME'] == target].copy()
      if profiles.empty:
          def matches(pattern, value):
              expression = re.escape(str(pattern))
              expression = expression.replace(r'\*\*', '.*')
              expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
              return re.fullmatch(expression, value) is not None

          candidates = all_profiles[
              all_profiles['DSBD_NAME'].map(lambda pattern: matches(pattern, target))
          ].copy()
          if not candidates.empty:
              candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                  '*', '', regex=False
              ).str.replace('%', '', regex=False).str.len()
              best = candidates['_specificity'].max()
              profiles = candidates[candidates['_specificity'] == best].copy()
      access = irrdbu00.datasetAccess
      sysprog = {str(x).upper() for x in sysprog_list} if sysprog_list else None

      def _approved(auth_id):
          if sysprog is None:
              return 'UNREVIEWED'
          return 'YES' if str(auth_id).upper() in sysprog else 'NO'

      findings = []
      hard_issues = []
      review_rows = 0
      unapproved_rows = 0

      if profiles.empty:
          hard_issues.append('No covering RACF data-set profile was found')
          findings.append({
              'DSBD_NAME': target, 'DSBD_UACC': 'MISSING',
              'DSBD_AUDIT_LEVEL': 'MISSING', 'DSBD_AUDIT_OKQUAL': 'MISSING',
              'DSACC_AUTH_ID': '', 'AUTH_TYPE': '', 'DSACC_ACCESS': '', 'APPROVED': ''
          })
      else:
          for _, profile in profiles.iterrows():
              uacc = str(profile['DSBD_UACC']).upper()
              audit_level = str(profile['DSBD_AUDIT_LEVEL']).upper()
              audit_qual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
              uacc_ok = ranks.get(uacc, 99) <= ranks['READ']
              audit_ok = (
                  audit_level == 'ALL' and
                  ranks.get(audit_qual, 99) <= ranks['UPDATE']
              )
              if not uacc_ok:
                  hard_issues.append(f'UACC={uacc} exceeds READ')
              if not audit_ok:
                  hard_issues.append(
                      f'AUDIT={audit_level}({audit_qual or "NONE"}) does not log '
                      f'all successful and failed UPDATE-or-greater access'
                  )

              related = access[
                  (access['DSACC_NAME'] == profile['DSBD_NAME']) &
                  (
                      access['DSACC_ACCESS'].map(
                          lambda value: ranks.get(str(value).upper(), -1)
                      ) >= ranks['UPDATE']
                  )
              ]
              review_rows += len(related)
              if related.empty:
                  findings.append({
                      'DSBD_NAME': profile['DSBD_NAME'],
                      'DSBD_UACC': uacc,
                      'DSBD_AUDIT_LEVEL': audit_level,
                      'DSBD_AUDIT_OKQUAL': audit_qual,
                      'DSACC_AUTH_ID': '',
                      'AUTH_TYPE': '',
                      'DSACC_ACCESS': '',
                      'APPROVED': ''
                  })
              else:
                  for _, permit in related.iterrows():
                      appr = _approved(permit['DSACC_AUTH_ID'])
                      if appr != 'YES':
                          unapproved_rows += 1
                      findings.append({
                          'DSBD_NAME': profile['DSBD_NAME'],
                          'DSBD_UACC': uacc,
                          'DSBD_AUDIT_LEVEL': audit_level,
                          'DSBD_AUDIT_OKQUAL': audit_qual,
                          'DSACC_AUTH_ID': permit['DSACC_AUTH_ID'],
                          'AUTH_TYPE': auth_type(permit['DSACC_AUTH_ID']),
                          'DSACC_ACCESS': permit['DSACC_ACCESS'],
                          'APPROVED': appr
                      })

      hard_issues = sorted(set(hard_issues))
      if hard_issues:
          status = 'FAIL'
          detail = target + ': ' + '; '.join(hard_issues)
      elif unapproved_rows:
          status = 'REVIEW'
          detail = (
              f'RACF profile settings for {target} meet the technical thresholds; '
              f'validate {unapproved_rows} permit(s) not in the system-programmer list'
          )
      elif review_rows:
          status = 'PASS'
          detail = (
              f'Write access to {target} is limited to {review_rows} approved '
              'system-programmer permit(s)'
          )
      else:
          status = 'PASS'
          detail = f'RACF profile settings for {target} meet the technical thresholds'
  assertion:
    type: python_result
    pass_message: STIG requirement satisfied
    fail_message: STIG requirement not satisfied
