  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 1.3 (v1.1.0 addition) – USER ATTRIBUTES
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-1.3.4
    title: "Ensure all STARTED class profiles specify PROTECTED user IDs"
    stig:
      rule_id: N/A
      severity: high
      requirement_excerpt: >
        Every user ID assigned to a STARTED class profile must be PROTECTED
        (NOPASSWORD/NOPHRASE) so it cannot be used for interactive logon,
        preventing privilege escalation through started task identities.
    cis:
      section: "1.3.4"
      level: L1
      benchmark: "CIS IBM z/OS V2R5 with RACF v1.1.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.generalSTDATA + irrdbu00.users
      select_columns: [GRST_NAME, GRST_USER_ID, USBD_NOPWD]
      logic: |
        stc_users = df[df['GRST_CLASS_NAME'] == 'STARTED'][['GRST_NAME','GRST_USER_ID']].copy()
        stc_users = stc_users[stc_users['GRST_USER_ID'].notna() & (stc_users['GRST_USER_ID'] != '')]
        merged = stc_users.merge(
            users_df[['USBD_NAME','USBD_NOPWD']],
            left_on='GRST_USER_ID', right_on='USBD_NAME', how='left'
        )
        # USBD_NOPWD == 'PRO' means PROTECTED (no password and no passphrase).
        # 'NO' = has a password, 'PHR' = has a passphrase, NaN = user ID not
        # defined in RACF. Anything other than 'PRO' is not a protected user.
        not_protected = merged[merged['USBD_NOPWD'] != 'PRO'][['GRST_NAME','GRST_USER_ID','USBD_NOPWD']]
        findings = not_protected.to_dict('records')
        count = len(not_protected)
        status = 'PASS' if count == 0 else 'FAIL'
        detail = f"{count} STARTED profile(s) whose user ID is not PROTECTED or is undefined"
      assertion:
        type: python_result
        pass_message: "All STARTED profile user IDs are PROTECTED"
        fail_message: "{count} STARTED profile(s) reference a non-PROTECTED user ID"
    remediation: >
      For each user ID listed, issue: ALTUSER <userid> NOPASSWORD NOPHRASE
      This marks the user as PROTECTED and prevents interactive logon.

