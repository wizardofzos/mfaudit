  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 1.3 – USER ATTRIBUTES
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-1.3.1
    title: "Ensure use of RACF SPECIAL attribute is minimized"
    stig:
      rule_id: V-223713
      severity: high
      requirement_excerpt: >
        The SPECIAL attribute grants unrestricted access to all RACF functions.
        Assignment must be strictly limited and justified.
    cis:
      section: "1.3.1"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.users
      select_columns: [USBD_NAME, USBD_SPECIAL, USBD_REVOKE]
      logic: |
        findings_df = df[(df['USBD_SPECIAL'] == 'YES') & (df['USBD_REVOKE'] == 'NO')][['USBD_NAME','USBD_SPECIAL','USBD_REVOKE']]
        findings = findings_df.to_dict('records')
        count = len(findings_df)
        status = 'PASS' if count == 0 else 'REVIEW'
        detail = f"{count} active user(s) with SPECIAL attribute"
      assertion:
        type: python_result
        pass_message: "No active users have SPECIAL attribute"
        fail_message: "{count} active user(s) have SPECIAL — review for justification"
    remediation: >
      Review each user with SPECIAL=YES. Remove SPECIAL from any user ID not explicitly
      authorized to perform RACF administration.

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 2.1 – DATA PROTECTION
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-2.1.3
    title: "Ensure WHEN(PROGRAM) SETROPTS value is active"
    stig:
      rule_id: V-223708
