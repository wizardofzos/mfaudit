    implementation:
      engine: python
      dataset: ""
      logic: |
        # Legacy dataset (OS) PASSWORD protection is recorded in the catalog/VTOC,
        # not in SETROPTS or the IRRDBU00 unload, so it cannot be evaluated from
        # the available evidence. Surface this as a manual review item.
        status = 'REVIEW'
        detail = (
            "Manual review required: verify no data sets rely on the legacy "
            "dataset PASSWORD facility (LISTDSD / catalog PASSWORD attribute). "
            "This is not represented in SETROPTS or the IRRDBU00 unload."
        )
