            status = 'FAIL'
            detail = "UNIXPRIV class not found in SETROPTS"
            findings = [{'name': 'UNIXPRIV', 'CLASSACT': 'NOT SET', 'RACLIST': 'NOT SET'}]
        else:
            act = row['CLASSACT'].values[0]
            rac = row['RACLIST'].values[0]
            status = 'PASS' if act == 'YES' and rac == 'YES' else 'FAIL'
            detail = f"CLASSACT={act}, RACLIST={rac}"
            findings = row[['name','CLASSACT','RACLIST']].to_dict('records')
      assertion:
        type: python_result
        pass_message: "UNIXPRIV class is ACTIVE and RACLISTed"
        fail_message: "UNIXPRIV class is not properly activated (CLASSACT={CLASSACT}, RACLIST={RACLIST})"
    remediation: >
      Issue: SETROPTS CLASSACT(UNIXPRIV) RACLIST(UNIXPRIV)

  - control_id: CIS-9.21
    title: "Ensure ability to switch to superuser (BPX.SUPERUSER) is restricted"
    stig:
      rule_id: N/A
      severity: high
      requirement_excerpt: >
        The UNIXPRIV class profile BPX.SUPERUSER grants a user the ability to
        assume full z/OS UNIX superuser privilege. Its UACC must be NONE and
        access must be explicitly granted only to authorized users.
    cis:
      section: "9.21"
      level: L1
      benchmark: "CIS IBM z/OS V2R5 with RACF v1.1.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.generals + irrdbu00.generalAccess
      select_columns: [GRBD_NAME, GRBD_CLASS_NAME, GRBD_UACC, GRACC_AUTH_ID, GRACC_ACCESS]
      logic: |
        profile = df[(df['GRBD_CLASS_NAME'] == 'UNIXPRIV') & (df['GRBD_NAME'] == 'BPX.SUPERUSER')]
        if len(profile) == 0:
            status = 'FAIL'
            detail = "BPX.SUPERUSER profile does not exist in UNIXPRIV class"
            findings = [{'GRBD_NAME': 'BPX.SUPERUSER', 'GRBD_CLASS_NAME': 'UNIXPRIV', 'GRBD_UACC': 'NOT DEFINED'}]
        else:
            uacc = profile['GRBD_UACC'].values[0]
            accesses = access_df[(access_df['GRACC_CLASS_NAME'] == 'UNIXPRIV') & (access_df['GRACC_NAME'] == 'BPX.SUPERUSER')][['GRACC_AUTH_ID','GRACC_ACCESS']]
            uacc_ok = str(uacc).upper() == 'NONE'
            status = 'PASS' if uacc_ok else 'FAIL'
            detail = f"BPX.SUPERUSER UACC={uacc}, {len(accesses)} explicit permit(s)"
            findings = [{'GRBD_NAME': 'BPX.SUPERUSER', 'GRBD_UACC': uacc}] + accesses.to_dict('records')
      assertion:
        type: python_result
        pass_message: "BPX.SUPERUSER exists with UACC(NONE)"
        fail_message: "BPX.SUPERUSER has UACC={GRBD_UACC} — superuser access is not properly restricted"
    remediation: >
      Issue: RALTER UNIXPRIV BPX.SUPERUSER UACC(NONE)
      Then explicitly permit only authorized users: PERMIT BPX.SUPERUSER CLASS(UNIXPRIV) ID(<userid>) ACCESS(READ)
      Issue: SETROPTS RACLIST(UNIXPRIV) REFRESH

