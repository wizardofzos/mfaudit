            detail = f"CLASSACT={act}"
            findings = row[['name','CLASSACT']].to_dict('records')
      assertion:
        type: python_result
        pass_message: "TEMPDSN class is ACTIVE"
        fail_message: "TEMPDSN class is not ACTIVE"
    remediation: >
      Issue: SETROPTS CLASSACT(TEMPDSN)

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 2.1 – DATA PROTECTION (runtime library write-access additions)
  # APF / PARMLIB / PROCLIB write-access review. Require --apf-list /
  # --parmlib-list / --proclib-list respectively; SKIP when not supplied.
  # Optional --sysprog-list auto-resolves (PASS) when writers are all approved.
  # Cross-reference STIG V-223682 / V-223697 / V-223687.
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-2.1.8
    title: Ensure WRITE or greater access to APF-authorized libraries is limited to systems programmers
    cis:
      section: 2.1.8
      level: L1
      benchmark: CIS z/OS 2.5.0
    stig:
      rule_id: V-223682
      severity: high
    data_sources_needed:
    - irrdbu00
    - apf_list
    implementation:
      engine: python
      dataset: irrdbu00.datasets
      logic: |
        import re

        libraries = apf_list
        ranks = {'NONE': 0, 'EXECUTE': 1, 'READ': 2, 'UPDATE': 3, 'CONTROL': 4, 'ALTER': 5}
        audit_required = True
        required_audit_threshold = 'UPDATE'
        user_ids = set(irrdbu00.users['USBD_NAME'].astype(str).str.upper())
        group_ids = set(irrdbu00.groups['GPBD_NAME'].astype(str).str.upper())
        all_profiles = irrdbu00.datasets
        all_access = irrdbu00.datasetAccess

        def auth_type(value):
            auth_id = str(value).upper()
            if auth_id in user_ids:
                return 'USER'
            if auth_id in group_ids:
                return 'GROUP'
            return 'UNRESOLVED'

        def matches(pattern, value):
            expression = re.escape(str(pattern))
            expression = expression.replace(r'\*\*', '.*')
            expression = expression.replace(r'\*', '[^.]*').replace('%', '[^.]')
            return re.fullmatch(expression, value) is not None

        hard_issues = []
        review_access = {}
        for library in libraries:
            profiles = all_profiles[all_profiles['DSBD_NAME'] == library].copy()
            if profiles.empty:
                candidates = all_profiles[
                    all_profiles['DSBD_NAME'].map(
                        lambda pattern: matches(pattern, library)
                    )
                ].copy()
                if not candidates.empty:
                    candidates['_specificity'] = candidates['DSBD_NAME'].str.replace(
                        '*', '', regex=False
                    ).str.replace('%', '', regex=False).str.len()
                    best = candidates['_specificity'].max()
                    profiles = candidates[candidates['_specificity'] == best].copy()

            if profiles.empty:
                hard_issues.append(f'{library}: no covering RACF profile')
                continue

            for _, profile in profiles.iterrows():
                uacc = str(profile['DSBD_UACC']).upper()
                level = str(profile['DSBD_AUDIT_LEVEL']).upper()
                okqual = str(profile['DSBD_AUDIT_OKQUAL']).upper()
                if ranks.get(uacc, 99) > ranks['READ']:
                    hard_issues.append(f'{library}: UACC={uacc}')
                if audit_required and not (
                    level == 'ALL' and
                    ranks.get(okqual, 99) <= ranks[required_audit_threshold]
                ):
                    hard_issues.append(
                        f'{library}: AUDIT={level}({okqual or "NONE"})'
                    )

                related = all_access[
                    (all_access['DSACC_NAME'] == profile['DSBD_NAME']) &
                    (
                        all_access['DSACC_ACCESS'].map(
                            lambda value: ranks.get(str(value).upper(), -1)
                        ) >= ranks['UPDATE']
                    )
                ]
                for _, permit in related.iterrows():
                    auth_id = str(permit['DSACC_AUTH_ID']).upper()
                    access = str(permit['DSACC_ACCESS']).upper()
                    item = review_access.setdefault(auth_id, {
                        'auth_type': auth_type(auth_id),
