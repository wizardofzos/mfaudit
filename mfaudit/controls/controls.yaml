  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 2.4 – USER PRIVILEGE
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-2.4.1
    title: "Ensure OPERATIONS attribute assignment is tightly controlled"
    stig:
      rule_id: V-223714
      severity: high
      requirement_excerpt: >
        The OPERATIONS attribute grants read/write access to all DASD datasets.
        Its assignment must be strictly limited and justified.
    cis:
      section: "2.4.1"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.users
      select_columns: [USBD_NAME, USBD_OPER, USBD_REVOKE]
      logic: |
        findings_df = df[(df['USBD_OPER'] == 'YES') & (df['USBD_REVOKE'] == 'NO')][['USBD_NAME','USBD_OPER','USBD_REVOKE']]
        findings = findings_df.to_dict('records')
        count = len(findings_df)
        status = 'PASS' if count == 0 else 'REVIEW'
        detail = f"{count} active user(s) with OPERATIONS attribute"
      assertion:
        type: python_result
        pass_message: "No active users have OPERATIONS attribute"
        fail_message: "{count} active user(s) have OPERATIONS — review for justification"
    remediation: >
      Review each user with OPER=YES. Remove OPERATIONS from any user ID not explicitly
      authorized to perform systems programming or equivalent functions.

  - control_id: CIS-2.4.4
    title: "Ensure UID 0 is only assigned to PROTECTED STC IDs"
    stig:
      rule_id: V-223756
      severity: high
      requirement_excerpt: >
        UID(0) (superuser) must only be assigned to PROTECTED started task user
        IDs, not to interactive users.
    cis:
      section: "2.4.4"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.userOMVS + irrdbu00.users
      select_columns: [USOMVS_NAME, USOMVS_UID, USBD_NOPWD]
      logic: |
        # USOMVS_UID is a zero-padded string (e.g. '0000000000'), so compare numerically.
        uid0 = omvs_df[pd.to_numeric(omvs_df['USOMVS_UID'], errors='coerce') == 0][['USOMVS_NAME','USOMVS_UID']]
        merged = uid0.merge(users_df[['USBD_NAME','USBD_NOPWD']], left_on='USOMVS_NAME', right_on='USBD_NAME', how='left')
        # USBD_NOPWD == 'PRO' means PROTECTED (no password, no passphrase).
        # 'NO' = has a password, 'PHR' = has a passphrase; both are interactive-
        # capable so neither is protected.
        not_protected = merged[merged['USBD_NOPWD'] != 'PRO'].copy()
        _reason = {'NO': 'has password', 'PHR': 'has passphrase', 'PRO': 'protected'}
        not_protected['REASON'] = not_protected['USBD_NOPWD'].map(
            lambda v: _reason.get(v, 'undefined / no user profile')
        )
        findings = not_protected[['USOMVS_NAME','USOMVS_UID','USBD_NOPWD','REASON']].to_dict('records')
        count = len(not_protected)
        status = 'PASS' if count == 0 else 'FAIL'
        detail = f"{count} UID(0) user(s) that are NOT PROTECTED (have a password or passphrase)"
      assertion:
        type: python_result
        pass_message: "All UID(0) accounts are PROTECTED"
        fail_message: "{count} UID(0) account(s) are not PROTECTED"
    remediation: >
      For each non-PROTECTED UID(0) user, either:
      - Add NOPASSWORD to the user profile to make it PROTECTED, or
      - Change the OMVS UID to a non-zero value.

