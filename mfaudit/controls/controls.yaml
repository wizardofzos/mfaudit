  # ─────────────────────────────────────────────────────────────────────────────
  # CUSTOM CONTROLS
  # Controls that reflect internal policy, client-specific requirements, or any
  # rule that doesn't map to a published CIS/STIG benchmark.
  #
  # Schema for a custom control:
  #
  #   control_id: CUSTOM-<anything>   ← free-form, must be unique
  #   title: "..."
  #   severity: high | medium | low   ← top-level (no stig block needed)
  #   requirement: >                  ← top-level (replaces stig.requirement_excerpt)
  #     Plain-text policy statement.
  #   custom:
  #     benchmark: "Internal Security Policy v1.0"   ← groups controls in report
  #     category:  "Access Control"                   ← used for section grouping
  #     reference: "ISP-AC-001"                       ← ticket / policy ref (optional)
  #   data_sources_needed: [setropts | irrdbu00 | dcollect]
  #   implementation:
  #     engine: pandas_query | python
  #     dataset: ...
  #     ...
  #   remediation: >
  #     ...
  #
  # Example — ensure no active non-STC user has both SPECIAL and OPERATIONS:
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CUSTOM-1.1
    title: "No active user may hold both SPECIAL and OPERATIONS simultaneously"
    severity: high
    requirement: >
      Combining SPECIAL (unrestricted RACF administration) and OPERATIONS
      (unrestricted DASD read/write) in a single user ID creates an account
      that can both modify security policy and access all data with no
      segregation of duties. This is prohibited by internal policy.
    custom:
      benchmark: "Internal Security Policy v1.0"
      category: "Privilege Separation"
      reference: "ISP-AC-007"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.users
      select_columns: [USBD_NAME, USBD_SPECIAL, USBD_OPER, USBD_REVOKE]
      logic: |
        findings_df = df[
            (df['USBD_SPECIAL'] == 'YES') &
            (df['USBD_OPER']    == 'YES') &
            (df['USBD_REVOKE']  == 'NO')
        ][['USBD_NAME','USBD_SPECIAL','USBD_OPER']]
        findings = findings_df.to_dict('records')
        count = len(findings_df)
        status = 'PASS' if count == 0 else 'FAIL'
        detail = f"{count} active user(s) with both SPECIAL and OPERATIONS"
      assertion:
        type: python_result
        pass_message: "No active user holds both SPECIAL and OPERATIONS"
        fail_message: "{count} user(s) combine SPECIAL + OPERATIONS — segregation of duties violation"
    remediation: >
      For each user listed, remove one of the two attributes.
      OPERATIONS tasks: ALTUSER <userid> NOOPER
      RACF admin tasks: ALTUSER <userid> NOSPECIAL
