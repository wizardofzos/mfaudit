# MFAudit Controls
# Sources:
#   CIS IBM z/OS V2R5 with RACF Benchmark v1.0.0 / v1.1.0
#   CIS IBM Db2 13 for z/OS Benchmark v1.0.0
#   CIS IBM CICS Transaction Server 6.1 Benchmark v1.1.0


controls:

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 1.1 – PASSWORD CONTROL
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-1.1.1
    title: "Ensure PASSWORD(INTERVAL) is set to no longer than 90 days"
    stig:
      rule_id: V-223727
      severity: medium
      requirement_excerpt: >
        The PASSWORD(INTERVAL(n)) command sets the maximum age of a password.
        Set to 90 days or fewer.
    cis:
      section: "1.1.1"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: pandas_query
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      filter: "Setting == 'INTERVAL'"
      assertion:
        type: scalar_compare
        operator: "<="
        expected: 90
        fail_message: "PASSWORD INTERVAL exceeds 90 days (value: {value})"
        pass_message: "PASSWORD INTERVAL is {value} days (≤ 90)"
    remediation: >
      Issue: SETROPTS PASSWORD(INTERVAL(90))
      Adjust the value down to 90 or fewer to meet the benchmark.

  - control_id: CIS-1.1.2
    title: "Ensure PASSWORD(HISTORY) is set to at least 4"
    stig:
      rule_id: V-223728
      severity: medium
      requirement_excerpt: >
        Set the PASSWORD(HISTORY(n)) RACF option to 4 or more to prevent
        reuse of recent passwords.
    cis:
      section: "1.1.2"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: pandas_query
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      filter: "Setting == 'HISTORY'"
      assertion:
        type: scalar_compare
        operator: ">="
        expected: 4
        fail_message: "PASSWORD HISTORY is {value} (must be ≥ 4)"
        pass_message: "PASSWORD HISTORY is {value} (≥ 4)"
    remediation: >
      Issue: SETROPTS PASSWORD(HISTORY(4))

  - control_id: CIS-1.1.3
    title: "Ensure PASSWORD(RULEn) values are set"
    stig:
      rule_id: V-223724
      severity: medium
      requirement_excerpt: >
        RACF password rules (RULE1–RULE8) enforce password complexity.
        At least one rule must be defined and RULES must be active.
    cis:
      section: "1.1.3"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        rules_active = df.loc[df['Setting'] == 'RULES', 'Value'].values
        rule_rows = df[df['Setting'].str.match(r'^RULE\d$') & (df['Value'] != 'FALSE')]
        if len(rules_active) > 0 and rules_active[0] == 'TRUE' and len(rule_rows) > 0:
            status = 'PASS'
            detail = f"RULES=TRUE and {len(rule_rows)} rule(s) defined"
        else:
            status = 'FAIL'
            detail = f"RULES={rules_active[0] if len(rules_active) else 'NOT SET'}, active rules: {len(rule_rows)}"
        findings = rule_rows[['Setting','Value']].to_dict('records')
      assertion:
        type: python_result
        pass_message: "Password rules active and at least one rule defined"
        fail_message: "Password rules not active or no rules defined"
    remediation: >
      Issue: SETROPTS PASSWORD(RULES(RULE1(...)))
      Define at least one password rule to enforce complexity requirements.

  - control_id: CIS-1.1.4
    title: "Ensure PASSWORD(MINCHANGE) is greater than zero"
    stig:
      rule_id: V-223726
      severity: medium
      requirement_excerpt: >
        The MINCHANGE suboperand specifies the minimum number of days before
        a user can change their password again. Must be > 0.
    cis:
      section: "1.1.4"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: pandas_query
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      filter: "Setting == 'MINCHANG'"
      assertion:
        type: scalar_compare
        operator: ">"
        expected: 0
        fail_message: "PASSWORD MINCHANGE is {value} (must be > 0)"
        pass_message: "PASSWORD MINCHANGE is {value} days"
    remediation: >
      Issue: SETROPTS PASSWORD(MINCHANGE(1))

  - control_id: CIS-1.1.5
    title: "Ensure PASSWORD(REVOKE) is specified"
    stig:
      rule_id: V-223695
      severity: medium
      requirement_excerpt: >
        The REVOKE suboperand specifies the number of consecutive unsuccessful
        logon attempts that cause RACF to revoke the user ID. Must not be FALSE.
    cis:
      section: "1.1.5"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        row = df.loc[df['Setting'] == 'REVOKE', 'Value']
        val = row.values[0] if len(row) > 0 else 'FALSE'
        try:
            ival = int(val)
            status = 'PASS' if ival > 0 else 'FAIL'
            detail = f"REVOKE={val}"
        except:
            status = 'FAIL'
            detail = f"REVOKE={val} (not set or FALSE)"
        findings = [{'Setting': 'REVOKE', 'Value': val}]
      assertion:
        type: python_result
        pass_message: "PASSWORD REVOKE is active (value: {value})"
        fail_message: "PASSWORD REVOKE is not set or is FALSE"
    remediation: >
      Issue: SETROPTS PASSWORD(REVOKE(5))
      Recommended value is 5 or fewer consecutive failures.

  - control_id: CIS-1.1.6
    title: "Ensure KDFAES algorithm is used for password encryption"
    stig:
      rule_id: V-223729
      severity: high
      requirement_excerpt: >
        KDFAES is the strongest password protection algorithm available.
        The PWDALG setting must reflect KDFAES.
    cis:
      section: "1.1.6"
      level: L2
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        row = df.loc[df['Setting'] == 'PWDALG', 'Value']
        val = str(row.values[0]).upper() if len(row) > 0 else ''
        status = 'PASS' if 'KDFAES' in val else 'FAIL'
        detail = f"PWDALG={val}"
        findings = [{'Setting': 'PWDALG', 'Value': val}]
      assertion:
        type: python_result
        pass_message: "Password algorithm is KDFAES"
        fail_message: "Password algorithm is not KDFAES (value: {value})"
    remediation: >
      Issue: SETROPTS PASSWORD(ALGORITHM(KDFAES))
      Note: All existing passwords will need to be reset after this change.

  - control_id: CIS-1.1.7
    title: "Ensure PASSWORD(WARNING) is set"
    stig:
      rule_id: V-275
      severity: low
      requirement_excerpt: >
        The WARNING suboperand specifies the number of days before password
        expiry that RACF warns the user. Must not be FALSE.
    cis:
      section: "1.1.7"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        row = df.loc[df['Setting'] == 'WARNING', 'Value']
        val = row.values[0] if len(row) > 0 else 'FALSE'
        try:
            ival = int(val)
            status = 'PASS' if ival > 0 else 'FAIL'
            detail = f"WARNING={val} days"
        except:
            status = 'FAIL'
            detail = f"WARNING={val} (not set)"
        findings = [{'Setting': 'WARNING', 'Value': val}]
      assertion:
        type: python_result
        pass_message: "PASSWORD WARNING is set to {value} days"
        fail_message: "PASSWORD WARNING is not set"
    remediation: >
      Issue: SETROPTS PASSWORD(WARNING(14))

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 1.2 – SYSTEM SETTINGS
  # ─────────────────────────────────────────────────────────────────────────────

  - control_id: CIS-1.2.1
    title: "Ensure that Inactive users are automatically revoked"
    stig:
      rule_id: V-223723
      severity: medium
      requirement_excerpt: >
        SETROPTS INACTIVE(n) causes RACF to automatically revoke user IDs that
        have not logged on within n days. Must be set (not FALSE).
    cis:
      section: "1.2.1"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        row = df.loc[df['Setting'] == 'INACTIVE', 'Value']
        val = row.values[0] if len(row) > 0 else 'FALSE'
        try:
            ival = int(val)
            status = 'PASS' if ival > 0 else 'FAIL'
            detail = f"INACTIVE={val} days"
        except:
            status = 'FAIL'
            detail = f"INACTIVE={val} (disabled)"
        findings = [{'Setting': 'INACTIVE', 'Value': val}]
      assertion:
        type: python_result
        pass_message: "Inactive user revocation is active ({value} days)"
        fail_message: "Inactive user revocation is DISABLED"
    remediation: >
      Issue: SETROPTS INACTIVE(60)
      Recommended: 60 days or fewer.

  - control_id: CIS-1.2.5
    title: "Ensure started tasks defined with TRUSTED attribute are justified"
    stig:
      rule_id: V-223661
      severity: medium
      requirement_excerpt: >
        The TRUSTED attribute grants a started task the ability to bypass RACF
        access checking. Its use must be minimized and justified.
    cis:
      section: "1.2.5"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.generalSTDATA
      select_columns: [GRST_NAME, GRST_CLASS_NAME, GRST_USER_ID, GRST_GROUP_ID, GRST_TRUSTED]
      logic: |
        findings_df = df[df['GRST_TRUSTED'] == 'YES'][['GRST_NAME','GRST_USER_ID','GRST_GROUP_ID','GRST_TRUSTED']]
        findings = findings_df.to_dict('records')
        count = len(findings_df)
        status = 'PASS' if count == 0 else 'REVIEW'
        detail = f"{count} STARTED profile(s) with TRUSTED=YES"
      assertion:
        type: python_result
        pass_message: "No TRUSTED started tasks found"
        fail_message: "{count} STARTED task(s) have TRUSTED attribute — review for justification"
    remediation: >
      Review each STARTED profile with TRUSTED=YES. Remove TRUSTED where not required.
      Use PRIVILEGED only if TRUSTED is insufficient and remove where not needed.

  - control_id: CIS-1.2.6
    title: "Ensure OPERCMDS resource class is ACTIVE and RACLISTed"
    stig:
      rule_id: V-223658
      severity: medium
      requirement_excerpt: >
        The OPERCMDS class must be active and RACLISTed to protect MVS operator
        commands from unauthorized use.
    cis:
      section: "1.2.6"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.classInfo
      select_columns: [name, CLASSACT, RACLIST]
      logic: |
        row = df[df['name'] == 'OPERCMDS']
        if len(row) == 0:
            status = 'FAIL'
            detail = "OPERCMDS class not found in SETROPTS"
            findings = [{'name': 'OPERCMDS', 'CLASSACT': 'NOT SET', 'RACLIST': 'NOT SET'}]
        else:
            act = row['CLASSACT'].values[0]
            rac = row['RACLIST'].values[0]
            status = 'PASS' if act == 'YES' and rac == 'YES' else 'FAIL'
            detail = f"CLASSACT={act}, RACLIST={rac}"
            findings = row[['name','CLASSACT','RACLIST']].to_dict('records')
      assertion:
        type: python_result
        pass_message: "OPERCMDS is ACTIVE and RACLISTed"
        fail_message: "OPERCMDS is not properly activated (CLASSACT={CLASSACT}, RACLIST={RACLIST})"
    remediation: >
      Issue: SETROPTS CLASSACT(OPERCMDS) RACLIST(OPERCMDS)

