        val = str(row.values[0]).upper() if len(row) > 0 else 'FALSE'
        status = 'PASS' if val not in ('FALSE', '') else 'FAIL'
        detail = f"WHENPROG={val}"
        findings = [{'Setting': 'WHENPROG', 'Value': val}]
      assertion:
        type: python_result
        pass_message: "WHEN(PROGRAM) is active"
        fail_message: "WHEN(PROGRAM) is not active"
    remediation: >
      Issue: SETROPTS WHEN(PROGRAM)

  - control_id: CIS-2.1.6
    title: "Ensure ERASE(ALL) is set for data erasure on scratch"
    stig:
      rule_id: V-223731
      severity: medium
      requirement_excerpt: >
        SETROPTS ERASE(ALL) causes RACF to erase data from DASD when a dataset
        is scratched or released, preventing data remanence.
    cis:
      section: "2.1.6"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [setropts]
    implementation:
      engine: python
      dataset: setropts.fieldInfo
      select_columns: [Setting, Value]
      logic: |
        erase_row = df.loc[df['Setting'] == 'ERASE', 'Value']
        eraseall_row = df.loc[df['Setting'] == 'ERASEALL', 'Value']
        erase = str(erase_row.values[0]).upper() if len(erase_row) > 0 else 'FALSE'
        eraseall = str(eraseall_row.values[0]).upper() if len(eraseall_row) > 0 else 'FALSE'
        status = 'PASS' if eraseall == 'TRUE' else 'FAIL'
        detail = f"ERASE={erase}, ERASEALL={eraseall}"
        findings = [{'Setting': 'ERASE', 'Value': erase}, {'Setting': 'ERASEALL', 'Value': eraseall}]
      assertion:
        type: python_result
        pass_message: "ERASE(ALL) is active"
        fail_message: "ERASE(ALL) is not active (ERASEALL={ERASEALL})"
    remediation: >
      Issue: SETROPTS ERASE(ALL)

