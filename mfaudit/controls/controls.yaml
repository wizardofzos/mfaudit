    stig:
      rule_id: N/A
      severity: medium
      requirement_excerpt: >
        Each z/OS UNIX user must have a unique UID and each group a unique GID
        to ensure proper access separation in the UNIX environment.
    cis:
      section: "9.5"
      level: L1
      benchmark: "CIS z/OS 2.5.0"
    data_sources_needed: [irrdbu00]
    implementation:
      engine: python
      dataset: irrdbu00.userOMVS + irrdbu00.groupOMVS
      select_columns: [USOMVS_NAME, USOMVS_UID, GPOMVS_NAME, GPOMVS_GID]
      logic: |
        dup_uids = omvs_df[omvs_df.duplicated('USOMVS_UID', keep=False) & (omvs_df['USOMVS_UID'] != '0')][['USOMVS_NAME','USOMVS_UID']].sort_values('USOMVS_UID')
        dup_gids = gomvs_df[gomvs_df.duplicated('GPOMVS_GID', keep=False)][['GPOMVS_NAME','GPOMVS_GID']].sort_values('GPOMVS_GID')
        uid_count = len(dup_uids)
        gid_count = len(dup_gids)
        findings = dup_uids.to_dict('records') + dup_gids.to_dict('records')
        status = 'PASS' if uid_count == 0 and gid_count == 0 else 'FAIL'
        detail = f"{uid_count} duplicate UID(s) (non-zero), {gid_count} duplicate GID(s)"
