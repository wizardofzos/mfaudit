      assertion:
        type: python_result
        pass_message: "No datasets rely on legacy PASSWORD protection"
        fail_message: "Dataset PASSWORD protection is in use"
    remediation: >
      For any data set found using the legacy PASSWORD attribute, remove it and
      protect the data set with a RACF data set profile instead
      (for example: ADDSD '<dataset>' UACC(NONE) and appropriate PERMITs).

